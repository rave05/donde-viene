<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>¿Dónde Viene?</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #btnUbicacion {
      border: none;
      background: #2e7d32;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnUbicacion:hover {
      background: #256628;
    }

    #mapa {
      width: 100%;
      height: 55vh;
      min-height: 350px;
    }

    #panel {
      background: white;
      padding: 20px 20px clamp(180px, 32vh, 320px);
      max-width: 900px;
      margin: 0 auto;
    }

    #paradaSeleccionada,
    #listaLineas,
    #proximos {
      scroll-margin-top: 18px;
    }

    #estado {
      margin-bottom: 15px;
      font-size: 15px;
      color: #555;
    }

    #paradaSeleccionada {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #listaParadas {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .parada {
      width: 100%;
      text-align: left;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
    }

    .parada:hover {
      background: #eee;
    }

    .parada strong {
      display: block;
      margin-bottom: 4px;
    }

    #listaLineas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .linea {
      border: none;
      background: #1565c0;
      color: white;
      padding: 11px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .linea:hover {
      background: #0d47a1;
    }

    .linea:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .linea.seleccionada {
      background: #0d47a1;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.2);
    }

    #proximos {
      margin-top: 15px;
    }

    .bus {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .bus-principal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .bus-linea {
      font-size: 22px;
      font-weight: bold;
    }

    .bus-eta {
      font-size: 22px;
      font-weight: bold;
      color: #1565c0;
      white-space: nowrap;
    }

    .bus-detalles {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .cargando {
      color: #666;
      padding: 10px 0;
    }

    .error {
      color: #b00020;
      background: #ffebee;
      padding: 12px;
      border-radius: 8px;
    }

    .sin-buses {
      color: #666;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
    }

    /* =========================================
       MARCADOR DE PARADA
       ========================================= */

    .icono-parada {
      width: 34px;
      height: 34px;

      background: #1565c0;

      border: 3px solid white;

      border-radius: 50%;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.45);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;

      color: white;
    }


    /* =========================================
       MARCADOR DEL USUARIO
       ========================================= */

    .icono-usuario {
      width: 22px;
      height: 22px;

      background: #1976d2;

      border: 4px solid white;

      border-radius: 50%;

      box-shadow:
        0 0 0 3px rgba(25, 118, 210, 0.35),
        0 2px 7px rgba(0, 0, 0, 0.45);
    }


    /* =========================================
       MARCADOR DE BUS EN VIVO
       ========================================= */

    .icono-bus-vivo {
      width: 38px;
      height: 38px;
      background: #ef6c00;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow:
        0 0 0 3px rgba(239, 108, 0, 0.22),
        0 2px 8px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }



    .linea-contenido {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .linea-destino {
      font-size: 12px;
      font-weight: normal;
      opacity: 0.9;
    }

    .aviso-info {
      color: #555;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .bus-distancia {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        align-items: stretch;
      }

      header h1 {
        text-align: center;
      }

      #btnUbicacion {
        width: 100%;
      }

      #mapa {
        height: 50vh;
      }

      #panel {
        padding: 15px 15px 180px;
      }

      .bus-principal {
        align-items: flex-start;
      }

      .bus-eta {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>
      🚌 ¿Dónde Viene?
    </h1>

    <button id="btnUbicacion">
      📍 Usar mi ubicación
    </button>

  </header>


  <div id="mapa"></div>


  <section id="panel">

    <div id="estado">
      Buscando paradas...
    </div>

    <div id="paradaSeleccionada">
      Seleccioná una parada
    </div>

    <div id="listaParadas"></div>

    <div id="listaLineas"></div>

    <div id="proximos"></div>

  </section>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const API_BASE =
      'https://donde-viene-api.darriulatmaster.workers.dev';

    const RADIO_PARADAS = 2000;

    const CACHE_LINEAS_MS =
      5 * 60 * 1000;

    const INTERVALO_PROXIMOS_MS =
      30 * 1000;


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const estado =
      document.getElementById('estado');

    const paradaSeleccionada =
      document.getElementById('paradaSeleccionada');

    const listaParadas =
      document.getElementById('listaParadas');

    const listaLineas =
      document.getElementById('listaLineas');

    const proximos =
      document.getElementById('proximos');

    const btnUbicacion =
      document.getElementById('btnUbicacion');


    // =========================================================
    // ICONOS PERSONALIZADOS
    // =========================================================

    const iconoParada =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-parada">
            🚌
          </div>
        `,

        iconSize: [
          34,
          34
        ],

        iconAnchor: [
          17,
          17
        ],

        popupAnchor: [
          0,
          -18
        ]

      });


    const iconoUsuario =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-usuario"></div>
        `,

        iconSize: [
          22,
          22
        ],

        iconAnchor: [
          11,
          11
        ]

      });


    const iconoBusVivo =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-bus-vivo">🚌</div>
        `,

        iconSize: [
          38,
          38
        ],

        iconAnchor: [
          19,
          19
        ],

        popupAnchor: [
          0,
          -21
        ]

      });


    // =========================================================
    // MAPA
    // =========================================================

    const mapa =
      L.map('mapa').setView(
        [-34.9011, -56.1645],
        13
      );


    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        attribution:
          'Tiles &copy; Esri'
      }
    ).addTo(mapa);


    // =========================================================
    // VARIABLES
    // =========================================================


    let todasLasParadas = [];

    let marcadorUsuario = null;

    let circuloUsuario = null;

    let marcadoresParadas = [];

    let marcadoresBusesVivos = [];

    let paradaActual = null;

    let lineaActual = null;

    let variantActual = null;

    // Solo puede existir un temporizador y una petición de próximos buses.
    let temporizadorProximos = null;

    let abortControllerProximos = null;

    // Cada cambio de parada o línea crea una nueva sesión.
    // Las respuestas de sesiones anteriores se ignoran.
    let sesionProximos = 0;

    let consultaLineasActual = 0;

    const cacheLineas =
      new Map();

    // Conserva brevemente el último resultado NO vacío de cada
    // parada/variante. La API oficial puede devolver [] de forma
    // puntual entre dos respuestas válidas.
    let cacheBusesEnVivo = {
      timestamp: 0,
      data: []
    };

    const CACHE_BUSES_EN_VIVO_MS =
      15 * 1000;



    // =========================================================
    // CARGAR TODAS LAS PARADAS
    // =========================================================

    async function cargarParadas() {

      estado.textContent =
        'Cargando paradas...';

      try {

        const respuesta =
          await fetch(
            `${API_BASE}/stops`
          );

        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }

        const datos =
          await respuesta.json();

        if (!Array.isArray(datos)) {
          throw new Error(
            'La API no devolvió una lista de paradas'
          );
        }

        todasLasParadas =
          datos;

        estado.textContent =
          `Se cargaron ${datos.length} paradas.`;

      } catch (error) {

        console.error(
          'Error cargando paradas:',
          error
        );

        estado.innerHTML =
          `<div class="error">
            No se pudieron cargar las paradas.
          </div>`;
      }
    }


    // =========================================================
    // DISTANCIA
    // =========================================================

    function distanciaMetros(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad =
        Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 * Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }


    // =========================================================
    // PARADAS CERCANAS
    // =========================================================

    function obtenerParadasCercanas(
      lat,
      lon
    ) {

      const resultado = [];

      for (
        const parada of todasLasParadas
      ) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }

        const [
          paradaLon,
          paradaLat
        ] =
          parada.location.coordinates;

        const distancia =
          distanciaMetros(
            lat,
            lon,
            paradaLat,
            paradaLon
          );

        if (
          distancia <=
          RADIO_PARADAS
        ) {

          resultado.push({
            ...parada,
            distancia
          });
        }
      }

      resultado.sort(
        (a, b) =>
          a.distancia -
          b.distancia
      );

      return resultado.slice(
        0,
        15
      );
    }


    // =========================================================
    // MOSTRAR PARADAS EN LISTA
    // =========================================================

    function mostrarParadas(
      paradas
    ) {

      listaParadas.innerHTML =
        '';

      if (
        !paradas.length
      ) {

        listaParadas.innerHTML =
          `<div class="sin-buses">
            No encontramos paradas dentro de 2 km.
          </div>`;

        return;
      }


      for (
        const parada of paradas
      ) {

        const boton =
          document.createElement(
            'button'
          );

        boton.className =
          'parada';


        const nombre =
          [
            parada.street1,
            parada.street2
          ]
          .filter(Boolean)
          .join(' y ');


        boton.innerHTML = `
          <strong>
            🚌 ${nombre || 'Parada ' + parada.busstopId}
          </strong>

          <span>
            ${Math.round(parada.distancia)} m
          </span>
        `;


        boton.addEventListener(
          'click',
          () =>
            seleccionarParada(
              parada
            )
        );


        listaParadas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // MOSTRAR MARCADORES
    // =========================================================

    function mostrarMarcadores(
      paradas
    ) {

      // Borrar marcadores anteriores

      for (
        const marcador of
        marcadoresParadas
      ) {

        mapa.removeLayer(
          marcador
        );
      }


      marcadoresParadas =
        [];


      // Crear nuevos

      for (
        const parada of paradas
      ) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }


        const [
          lon,
          lat
        ] =
          parada.location.coordinates;


        const marcador =
          L.marker(
            [
              lat,
              lon
            ],
            {
              icon:
                iconoParada
            }
          )
          .addTo(mapa);


        const nombre =
          [
            parada.street1,
            parada.street2
          ]
          .filter(Boolean)
          .join(' y ');


        marcador.bindPopup(`
          <strong>
            🚌 PARADA
          </strong>

          <br><br>

          ${nombre || 'Parada ' + parada.busstopId}

          <br><br>

          <button
            onclick="
              seleccionarParadaPorId(
                ${parada.busstopId}
              )
            "
          >
            Ver líneas
          </button>
        `);


        marcadoresParadas.push(
          marcador
        );
      }
    }


    // =========================================================
    // SELECCIONAR PARADA DESDE MARCADOR
    // =========================================================

    window.seleccionarParadaPorId =
      function(id) {

        const parada =
          todasLasParadas.find(
            p =>
              String(
                p.busstopId
              ) ===
              String(id)
          );


        if (
          parada
        ) {

          seleccionarParada(
            parada
          );
        }
      };




    // =========================================================
    // SCROLL SUAVE DE NAVEGACIÓN
    // =========================================================

    function scrollSuaveA(
      elemento,
      margen = 14
    ) {

      if (!elemento) {
        return;
      }


      // scrollIntoView funciona de forma consistente tanto
      // en escritorio como en celular.
      elemento.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });


      // Pequeño ajuste para que el contenido no quede
      // pegado al borde superior de la pantalla.
      setTimeout(() => {
        const top =
          elemento.getBoundingClientRect().top;

        if (Math.abs(top) < margen + 30) {
          window.scrollBy({
            top: -margen,
            behavior: 'smooth'
          });
        }
      }, 350);
    }


    // =========================================================
    // SELECCIONAR PARADA
    // =========================================================

    async function seleccionarParada(
      parada
    ) {

      paradaActual =
        parada;


      cancelarActualizacionProximos();


      lineaActual =
        null;

      variantActual =
        null;


      proximos.innerHTML =
        '';


      listaLineas.innerHTML =
        `<div class="cargando">
          Cargando líneas...
        </div>`;


      const nombre =
        [
          parada.street1,
          parada.street2
        ]
        .filter(Boolean)
        .join(' y ');


      paradaSeleccionada.textContent =
        `🚌 ${nombre || 'Parada ' + parada.busstopId}`;


      const consultaId =
        ++consultaLineasActual;


      try {

        const cache =
          cacheLineas.get(
            String(
              parada.busstopId
            )
          );


        let lineas;


        if (
          cache &&
          Date.now() -
          cache.timestamp <
          CACHE_LINEAS_MS
        ) {

          lineas =
            cache.data;

        } else {

          const respuesta =
            await fetch(
              `${API_BASE}/stops/${encodeURIComponent(parada.busstopId)}/lines`
            );


          if (
            !respuesta.ok
          ) {

            throw new Error(
              `HTTP ${respuesta.status}`
            );
          }


          lineas =
            await respuesta.json();


          cacheLineas.set(
            String(
              parada.busstopId
            ),
            {
              timestamp:
                Date.now(),

              data:
                lineas
            }
          );
        }


        // Intentamos enriquecer cada variante con su destino actual.
        // Si esta consulta falla, las líneas igual se muestran normalmente.
        try {
          const respuestaBuses =
            await fetch(
              `${API_BASE}/buses?busstopId=${encodeURIComponent(parada.busstopId)}`
            );

          if (respuestaBuses.ok) {
            const busesParada =
              await respuestaBuses.json();

            if (Array.isArray(busesParada)) {
              const infoPorVariante =
                new Map();

              for (const bus of busesParada) {
                if (bus.lineVariantId != null) {
                  infoPorVariante.set(
                    String(bus.lineVariantId),
                    bus
                  );
                }
              }

              lineas = lineas.map(linea => {
                const info =
                  infoPorVariante.get(
                    String(linea.lineVariantId)
                  );

                return {
                  ...linea,
                  destination:
                    linea.destination ||
                    info?.destination ||
                    '',
                  origin:
                    linea.origin ||
                    info?.origin ||
                    ''
                };
              });
            }
          }
        } catch (error) {
          console.warn(
            'No se pudo enriquecer el destino de las líneas:',
            error
          );
        }


        if (
          consultaId !==
          consultaLineasActual
        ) {

          return;
        }


        mostrarLineas(
          lineas
        );


        // Al elegir una parada, llevamos al usuario
        // directamente a las líneas disponibles.
        requestAnimationFrame(
          () =>
            scrollSuaveA(
              listaLineas
            )
        );


      } catch (error) {

        console.error(
          error
        );


        if (
          consultaId ===
          consultaLineasActual
        ) {

          listaLineas.innerHTML =
            `<div class="error">
              No se pudieron cargar las líneas.
            </div>`;
        }
      }
    }


    // =========================================================
    // MOSTRAR LÍNEAS
    // =========================================================

    function mostrarLineas(
      lineas
    ) {

      listaLineas.innerHTML =
        '';


      if (
        !Array.isArray(lineas) ||
        !lineas.length
      ) {

        listaLineas.innerHTML =
          `<div class="sin-buses">
            No encontramos líneas para esta parada.
          </div>`;

        return;
      }


      const lineasUnicas =
        [];

      const vistos =
        new Set();


      for (
        const linea of lineas
      ) {

        const clave =
          `${linea.line}-${linea.lineVariantId || ''}`;


        if (
          !vistos.has(
            clave
          )
        ) {

          vistos.add(
            clave
          );

          lineasUnicas.push(
            linea
          );
        }
      }


      for (
        const linea of
        lineasUnicas
      ) {

        const boton =
          document.createElement(
            'button'
          );


        boton.className =
          'linea';


        boton.innerHTML = `
          <span class="linea-contenido">
            <span>${linea.line}</span>
            ${
              linea.destination
                ? `<span class="linea-destino">→ ${linea.destination}</span>`
                : ''
            }
          </span>
        `;


        boton.addEventListener(
          'click',
          () =>
            seleccionarLinea(
              linea,
              boton
            )
        );


        listaLineas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // BUSES EN VIVO EN EL MAPA
    // =========================================================

    function limpiarMarcadoresBusesVivos() {

      for (
        const marcador of
        marcadoresBusesVivos
      ) {

        mapa.removeLayer(
          marcador
        );
      }

      marcadoresBusesVivos = [];
    }


    function mostrarMarcadoresBusesVivos(
      buses,
      seleccion
    ) {

      limpiarMarcadoresBusesVivos();

      if (!Array.isArray(buses)) {
        return;
      }

      const puntosParaEncuadrar = [];

      // La parada seleccionada también entra en el encuadre.
      // Así siempre vemos la relación entre la parada y los buses.
      if (
        Number.isFinite(Number(seleccion?.stopLat)) &&
        Number.isFinite(Number(seleccion?.stopLon))
      ) {
        puntosParaEncuadrar.push([
          Number(seleccion.stopLat),
          Number(seleccion.stopLon)
        ]);
      }

      for (const bus of buses) {

        if (
          !bus.location ||
          !Array.isArray(bus.location.coordinates)
        ) {
          continue;
        }

        const [lon, lat] =
          bus.location.coordinates;

        if (
          !Number.isFinite(Number(lat)) ||
          !Number.isFinite(Number(lon))
        ) {
          continue;
        }

        const latNumero = Number(lat);
        const lonNumero = Number(lon);

        const marcador =
          L.marker(
            [latNumero, lonNumero],
            {
              icon: iconoBusVivo,
              zIndexOffset: 1200
            }
          )
          .addTo(mapa);

        const distanciaTexto =
          Number.isFinite(Number(bus.distanciaAParada))
            ? `<br><strong>Aprox. ${formatearDistancia(bus.distanciaAParada)} de la parada</strong>`
            : Number.isFinite(Number(bus.distance))
              ? `<br><strong>${formatearDistancia(bus.distance)} de la parada</strong>`
              : '';

        const etaTexto =
          Number.isFinite(Number(bus.eta))
            ? `<br>Llegada estimada: <strong>${formatearETA(bus.eta)}</strong>`
            : '';

        marcador.bindPopup(`
          <strong>🚌 ${bus.line || seleccion?.linea || ''}</strong>
          ${bus.busId ? `<br>Coche ${bus.busId}` : ''}
          ${bus.destination || seleccion?.destination ? `<br>→ ${bus.destination || seleccion.destination}` : ''}
          ${etaTexto}
          ${distanciaTexto}
        `);

        marcadoresBusesVivos.push(
          marcador
        );

        // Usamos como máximo los 3 primeros buses para no alejar
        // demasiado el mapa si hay un vehículo muy remoto.
        if (puntosParaEncuadrar.length < 4) {
          puntosParaEncuadrar.push([
            latNumero,
            lonNumero
          ]);
        }
      }

      if (puntosParaEncuadrar.length >= 2) {
        mapa.fitBounds(
          L.latLngBounds(puntosParaEncuadrar),
          {
            padding: [45, 45],
            maxZoom: 15,
            animate: true
          }
        );
      } else if (puntosParaEncuadrar.length === 1) {
        mapa.setView(
          puntosParaEncuadrar[0],
          15,
          { animate: true }
        );
      }
    }


    // =========================================================
    // SELECCIONAR LÍNEA
    // =========================================================


    async function seleccionarLinea(
      linea,
      boton
    ) {

      if (
        !paradaActual
      ) {
        return;
      }


      const variantId =
        linea.lineVariantId;


      if (
        !variantId
      ) {

        proximos.innerHTML =
          `<div class="error">
            Esta línea no tiene un lineVariantId válido.
          </div>`;

        return;
      }


      // Cancelamos cualquier consulta/temporizador anterior.
      // El botón NO se deshabilita: si el usuario vuelve a tocar
      // la misma línea, esa acción inicia una consulta nueva.
      cancelarActualizacionProximos();


      lineaActual =
        linea.line;


      variantActual =
        variantId;


      const seleccion = {
        sesionId:
          sesionProximos,

        stopId:
          paradaActual.busstopId,

        variantId,

        linea:
          linea.line,

        destination:
          linea.destination || '',

        stopLon:
          paradaActual.location?.coordinates?.[0],

        stopLat:
          paradaActual.location?.coordinates?.[1]
      };


      document
        .querySelectorAll(
          '.linea'
        )
        .forEach(
          b =>
            b.classList.remove(
              'seleccionada'
            )
        );


      boton.classList.add(
        'seleccionada'
      );


      proximos.innerHTML =
        `<div class="cargando">
          🔄 Buscando próximos ${linea.line}...
        </div>`;


      // Al elegir una línea, llevamos al usuario
      // a la zona donde aparecerán los buses.
      requestAnimationFrame(
        () =>
          scrollSuaveA(
            proximos
          )
      );


      await cargarProximos(
        seleccion
      );


      if (
        seleccion.sesionId ===
          sesionProximos
      ) {

        programarActualizacionProximos(
          seleccion
        );
      }
    }



    // =========================================================
    // CANCELAR ACTUALIZACIÓN
    // =========================================================


    function cancelarActualizacionProximos() {

      // Invalida de inmediato cualquier respuesta anterior.
      sesionProximos++;

      // Al cambiar de parada o línea, quitamos del mapa
      // los vehículos de la selección anterior.
      limpiarMarcadoresBusesVivos();


      if (
        temporizadorProximos
      ) {

        clearTimeout(
          temporizadorProximos
        );

        temporizadorProximos =
          null;
      }


      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();

        abortControllerProximos =
          null;
      }
    }


    function programarActualizacionProximos(
      seleccion
    ) {

      if (
        seleccion.sesionId !==
        sesionProximos
      ) {

        return;
      }


      if (
        temporizadorProximos
      ) {

        clearTimeout(
          temporizadorProximos
        );
      }


      temporizadorProximos =
        setTimeout(
          async () => {

            temporizadorProximos =
              null;


            if (
              seleccion.sesionId !==
              sesionProximos
            ) {

              return;
            }


            await cargarProximos(
              seleccion
            );


            if (
              seleccion.sesionId ===
              sesionProximos
            ) {

              programarActualizacionProximos(
                seleccion
              );
            }

          },
          INTERVALO_PROXIMOS_MS
        );
    }



    // =========================================================
    // CARGAR PRÓXIMOS
    // =========================================================


    async function cargarProximos(
      seleccion
    ) {

      if (
        !seleccion ||
        seleccion.sesionId !==
          sesionProximos
      ) {

        return;
      }


      const {
        stopId,
        variantId,
        linea,
        sesionId
      } =
        seleccion;


      // Nunca dejamos dos peticiones de próximos buses activas.
      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();
      }


      const controller =
        new AbortController();


      abortControllerProximos =
        controller;


      try {

        const url =
          `${API_BASE}/stops/${encodeURIComponent(stopId)}/upcomingbuses` +
          `?lineVariantIds=${encodeURIComponent(variantId)}` +
          `&amountperline=3`;


        const respuesta =
          await fetch(
            url,
            {
              signal:
                controller.signal
            }
          );


        if (
          !respuesta.ok
        ) {

          if (
            respuesta.status ===
            429
          ) {

            throw new Error(
              'Demasiadas consultas. Esperá unos segundos.'
            );
          }


          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        const datos =
          await respuesta.json();


        if (
          sesionId !==
          sesionProximos
        ) {

          return;
        }


        const claveResultado =
          `${stopId}|${variantId}`;


        if (
          Array.isArray(datos) &&
          datos.length > 0
        ) {

          mostrarMarcadoresBusesVivos(
            datos,
            seleccion
          );

          mostrarProximos(
            datos,
            linea,
            seleccion.destination
          );

        } else {

          await mostrarBusesLejanos(
            seleccion
          );
        }

      } catch (error) {

        if (
          error.name ===
          'AbortError'
        ) {

          return;
        }


        console.error(
          error
        );


        if (
          sesionId ===
          sesionProximos
        ) {

          proximos.innerHTML =
            `<div class="error">
              No se pudieron consultar los próximos buses.
              <br>
              <small>
                ${error.message}
              </small>
            </div>`;
        }

      } finally {

        // Solo limpia el controlador si sigue siendo el de ESTA petición.
        // Así una petición vieja nunca borra el controlador de una nueva.
        if (
          abortControllerProximos ===
          controller
        ) {

          abortControllerProximos =
            null;
        }
      }
    }



    async function obtenerBusesEnVivo() {

      if (
        Date.now() -
          cacheBusesEnVivo.timestamp <
          CACHE_BUSES_EN_VIVO_MS &&
        Array.isArray(cacheBusesEnVivo.data)
      ) {
        return cacheBusesEnVivo.data;
      }

      const respuesta =
        await fetch(
          `${API_BASE}/buses`
        );

      if (!respuesta.ok) {
        throw new Error(
          `HTTP ${respuesta.status}`
        );
      }

      const datos =
        await respuesta.json();

      if (!Array.isArray(datos)) {
        return [];
      }

      cacheBusesEnVivo = {
        timestamp: Date.now(),
        data: datos
      };

      return datos;
    }


    function formatearDistancia(
      metros
    ) {

      const numero =
        Number(metros);

      if (!Number.isFinite(numero)) {
        return 'Sin distancia';
      }

      if (numero < 1000) {
        return `${Math.round(numero)} m`;
      }

      return `${(numero / 1000).toFixed(1).replace('.', ',')} km`;
    }


    async function mostrarBusesLejanos(
      seleccion
    ) {

      if (
        seleccion.sesionId !==
          sesionProximos
      ) {
        return;
      }

      const {
        variantId,
        linea,
        destination,
        stopLat,
        stopLon
      } = seleccion;

      proximos.innerHTML =
        `<div class="cargando">
          Buscando vehículos de esta línea en circulación...
        </div>`;

      try {
        const buses =
          await obtenerBusesEnVivo();

        if (
          seleccion.sesionId !==
            sesionProximos
        ) {
          return;
        }

        const busesMismaVariante =
          buses
            .filter(bus =>
              String(bus.lineVariantId) ===
                String(variantId) &&
              bus.location &&
              Array.isArray(bus.location.coordinates)
            )
            .map(bus => {
              const [lon, lat] =
                bus.location.coordinates;

              const distancia =
                Number.isFinite(Number(stopLat)) &&
                Number.isFinite(Number(stopLon))
                  ? distanciaMetros(
                      Number(stopLat),
                      Number(stopLon),
                      Number(lat),
                      Number(lon)
                    )
                  : null;

              return {
                ...bus,
                distanciaAParada: distancia
              };
            })
            .sort((a, b) =>
              Number(a.distanciaAParada ?? Infinity) -
              Number(b.distanciaAParada ?? Infinity)
            );

        const destinoTexto =
          destination
            ? ` → ${destination}`
            : '';

        if (!busesMismaVariante.length) {
          limpiarMarcadoresBusesVivos();

          proximos.innerHTML = `
            <h3>${linea}${destinoTexto}</h3>
            <div class="aviso-info">
              <strong>Sin llegada estimada por ahora.</strong><br>
              No hay vehículos de esta variante reportando posición en este momento.
            </div>
          `;
          return;
        }

        mostrarMarcadoresBusesVivos(
          busesMismaVariante,
          seleccion
        );

        proximos.innerHTML = `
          <h3>${linea}${destinoTexto}</h3>
          <div class="aviso-info">
            <strong>Sin llegada estimada por ahora.</strong><br>
            Hay ${busesMismaVariante.length} vehículo${busesMismaVariante.length === 1 ? '' : 's'} de esta variante reportando ubicación.
            La distancia mostrada es aproximada y en línea recta hasta la parada.
          </div>
        `;

        for (const bus of busesMismaVariante.slice(0, 3)) {
          const elemento =
            document.createElement('div');

          elemento.className =
            'bus';

          elemento.innerHTML = `
            <div class="bus-principal">
              <div>
                <div class="bus-linea">
                  🚌 ${bus.line || linea}
                </div>
                <div class="bus-detalles">
                  ${bus.company || bus.companyName || ''}
                  ${bus.busId ? ' · Coche ' + bus.busId : ''}
                </div>
              </div>
              <div class="bus-eta">
                ${
                  bus.distanciaAParada != null
                    ? formatearDistancia(bus.distanciaAParada)
                    : 'Ubicación disponible'
                }
              </div>
            </div>
            <div class="bus-detalles">
              ${bus.origin || ''}
              ${bus.origin || bus.destination ? ' → ' : ''}
              ${bus.destination || destination || ''}
            </div>
            <div class="bus-distancia">
              Distancia aproximada a la parada
            </div>
          `;

          proximos.appendChild(
            elemento
          );
        }

      } catch (error) {
        console.error(
          'Error buscando buses en circulación:',
          error
        );

        if (
          seleccion.sesionId ===
            sesionProximos
        ) {
          limpiarMarcadoresBusesVivos();

          proximos.innerHTML = `
            <h3>${linea}${destination ? ` → ${destination}` : ''}</h3>
            <div class="aviso-info">
              <strong>Sin llegada estimada por ahora.</strong><br>
              No pudimos consultar la ubicación de los vehículos en circulación.
            </div>
          `;
        }
      }
    }


    // =========================================================
    // ETA
    // =========================================================

    function formatearETA(
      segundos
    ) {

      const numero =
        Number(
          segundos
        );


      if (
        !Number.isFinite(
          numero
        )
      ) {

        return 'Sin información';
      }


      if (
        numero <= 30
      ) {

        return 'Llegando';
      }


      const minutos =
        Math.round(
          numero / 60
        );


      if (
        minutos <= 1
      ) {

        return '1 min';
      }


      return `${minutos} min`;
    }


    // =========================================================
    // MOSTRAR PRÓXIMOS
    // =========================================================

    function mostrarProximos(
      buses,
      lineaMostrada,
      destinoMostrado = ''
    ) {

      if (
        !Array.isArray(
          buses
        ) ||
        !buses.length
      ) {

        proximos.innerHTML =
          `<div class="sin-buses">
            Sin llegada estimada por ahora.
          </div>`;

        return;
      }


      const ordenados =
        [...buses].sort(
          (a, b) =>
            Number(
              a.eta || 999999
            ) -
            Number(
              b.eta || 999999
            )
        );


      proximos.innerHTML =
        `<h3>
          Próximos ${lineaMostrada}${destinoMostrado ? ` → ${destinoMostrado}` : ''}
        </h3>`;


      for (
        const bus of
        ordenados
      ) {

        const elemento =
          document.createElement(
            'div'
          );


        elemento.className =
          'bus';


        const eta =
          formatearETA(
            bus.eta
          );


        elemento.innerHTML = `
          <div class="bus-principal">

            <div>

              <div class="bus-linea">
                🚌 ${bus.line || lineaMostrada}
              </div>

              <div class="bus-detalles">
                ${bus.companyName || ''}
                ${bus.busId ? ' · Coche ' + bus.busId : ''}
              </div>

            </div>

            <div class="bus-eta">
              ${eta}
            </div>

          </div>

          <div class="bus-detalles">
            ${bus.origin || ''}
            →
            ${bus.destination || ''}
          </div>

          <div class="bus-detalles">
            ${bus.subline || ''}
          </div>

          <div class="bus-detalles">
            ${bus.access || 'Sin datos'}
            ·
            ${bus.thermalConfort || 'Sin datos'}
          </div>

          ${
            Number.isFinite(Number(bus.distance))
              ? `<div class="bus-distancia">
                  Distancia informada: ${formatearDistancia(bus.distance)}
                </div>`
              : ''
          }
        `;


        proximos.appendChild(
          elemento
        );
      }
    }


    // =========================================================
    // GEOLOCALIZACIÓN
    // =========================================================

    function obtenerUbicacion() {

      if (
        !navigator.geolocation
      ) {

        estado.innerHTML =
          `<div class="error">
            Tu navegador no permite obtener la ubicación.
          </div>`;

        return;
      }


      btnUbicacion.disabled =
        true;


      btnUbicacion.textContent =
        '📍 Buscando...';


      estado.textContent =
        'Obteniendo tu ubicación...';


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;


          const lon =
            position.coords.longitude;


          // ==========================================
          // MARCADOR DEL USUARIO
          // ==========================================

          if (
            marcadorUsuario
          ) {

            mapa.removeLayer(
              marcadorUsuario
            );
          }


          marcadorUsuario =
            L.marker(
              [
                lat,
                lon
              ],
              {
                icon:
                  iconoUsuario,

                zIndexOffset:
                  1000
              }
            )
            .addTo(mapa);


          marcadorUsuario.bindPopup(
            `
              <strong>
                📍 TU UBICACIÓN
              </strong>
            `
          );


          // ==========================================
          // CÍRCULO DE RADIO
          // ==========================================

          if (
            circuloUsuario
          ) {

            mapa.removeLayer(
              circuloUsuario
            );
          }


          circuloUsuario =
            L.circle(
              [
                lat,
                lon
              ],
              {
                radius:
                  RADIO_PARADAS,

                color:
                  '#1976d2',

                fillColor:
                  '#1976d2',

                fillOpacity:
                  0.05,

                weight:
                  1
              }
            )
            .addTo(mapa);


          // ==========================================
          // CENTRAR MAPA
          // ==========================================

          mapa.setView(
            [
              lat,
              lon
            ],
            15
          );


          // ==========================================
          // BUSCAR PARADAS
          // ==========================================

          const cercanas =
            obtenerParadasCercanas(
              lat,
              lon
            );


          mostrarParadas(
            cercanas
          );


          mostrarMarcadores(
            cercanas
          );


          estado.textContent =
            `Encontramos ${cercanas.length} paradas cercanas.`;


          btnUbicacion.disabled =
            false;


          btnUbicacion.textContent =
            '📍 Actualizar ubicación';
        },


        function(error) {

          console.error(
            'Error geolocalización:',
            error
          );


          let mensaje =
            'No pudimos obtener tu ubicación.';


          if (
            error.code === 1
          ) {

            mensaje =
              'Permiso de ubicación denegado.';

          } else if (
            error.code === 2
          ) {

            mensaje =
              'No se pudo determinar tu ubicación.';

          } else if (
            error.code === 3
          ) {

            mensaje =
              'La ubicación tardó demasiado.';
          }


          estado.innerHTML =
            `<div class="error">
              ${mensaje}
            </div>`;


          btnUbicacion.disabled =
            false;


          btnUbicacion.textContent =
            '📍 Intentar nuevamente';
        },

        {
          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            30000
        }
      );
    }


    // =========================================================
    // BOTÓN UBICACIÓN
    // =========================================================

    btnUbicacion.addEventListener(
      'click',
      obtenerUbicacion
    );


    // =========================================================
    // INICIO
    // =========================================================

    async function iniciar() {

      await cargarParadas();

      obtenerUbicacion();
    }


    iniciar();

  </script>
