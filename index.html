<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¿Dónde Viene?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    #locationButton {
      margin-top: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 16px;
      cursor: pointer;
    }

    #locationButton:hover {
      opacity: 0.85;
    }

    #locationButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #map {
      width: 100%;
      height: calc(100vh - 145px);
    }

    .bus-popup {
      font-size: 14px;
      line-height: 1.5;
    }

    .stop-popup {
      font-size: 14px;
      line-height: 1.5;
    }

    .stop-popup strong {
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚌 ¿Dónde Viene?</h1>
    <p>Transporte público en tiempo real</p>

    <button id="locationButton">
      📍 Usar mi ubicación
    </button>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // ==========================================
    // CONFIGURACIÓN
    // ==========================================

    const API_BASE =
      'https://donde-viene-api.darriulatmaster.workers.dev';


    // ==========================================
    // MAPA
    // ==========================================

    const map = L.map('map').setView(
      [-34.9011, -56.1645],
      12
    );


    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri'
      }
    ).addTo(map);


    // ==========================================
    // ICONO DE LOS ÓMNIBUS
    // ==========================================

    const busIcon = L.divIcon({
      className: 'bus-marker',
      html: '🚌',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });


    // ==========================================
    // ICONO DE LAS PARADAS
    // ==========================================

    const stopIcon = L.divIcon({
      className: 'stop-marker',
      html: '🚏',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });


    // ==========================================
    // VARIABLES
    // ==========================================

    const locationButton =
      document.getElementById("locationButton");

    let userMarker = null;

    let stopMarkers = [];

    let todasLasParadas = null;


    // ==========================================
    // DISTANCIA ENTRE DOS PUNTOS
    // ==========================================

    function calcularDistancia(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const radLat1 =
        lat1 * Math.PI / 180;

      const radLat2 =
        lat2 * Math.PI / 180;

      const diferenciaLat =
        (lat2 - lat1) * Math.PI / 180;

      const diferenciaLon =
        (lon2 - lon1) * Math.PI / 180;


      const a =
        Math.sin(diferenciaLat / 2) *
        Math.sin(diferenciaLat / 2) +

        Math.cos(radLat1) *
        Math.cos(radLat2) *

        Math.sin(diferenciaLon / 2) *
        Math.sin(diferenciaLon / 2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;
    }


    // ==========================================
    // OBTENER TODAS LAS PARADAS
    // ==========================================

    async function cargarParadas() {

      if (todasLasParadas) {
        return todasLasParadas;
      }


      console.log(
        "Descargando paradas..."
      );


      const respuesta =
        await fetch(
          API_BASE + '/stops'
        );


      if (!respuesta.ok) {

        throw new Error(
          "Error obteniendo las paradas: " +
          respuesta.status
        );

      }


      todasLasParadas =
        await respuesta.json();


      console.log(
        "Paradas recibidas:",
        todasLasParadas.length
      );


      return todasLasParadas;
    }


    // ==========================================
    // MOSTRAR PARADAS CERCANAS
    // ==========================================

    async function mostrarParadasCercanas(
      latUsuario,
      lonUsuario
    ) {

      try {

        const paradas =
          await cargarParadas();


        // Borrar marcadores anteriores

        stopMarkers.forEach(
          marker => map.removeLayer(marker)
        );

        stopMarkers = [];


        // Calcular distancia de cada parada

        const paradasConDistancia =
          paradas
            .filter(parada => {

              return (
                parada.location &&
                parada.location.coordinates
              );

            })
            .map(parada => {

              const lon =
                parada.location.coordinates[0];

              const lat =
                parada.location.coordinates[1];


              const distancia =
                calcularDistancia(
                  latUsuario,
                  lonUsuario,
                  lat,
                  lon
                );


              return {
                parada,
                lat,
                lon,
                distancia
              };

            });


        // Ordenar de más cercana a más lejana

        paradasConDistancia.sort(
          (a, b) =>
            a.distancia - b.distancia
        );


        // Mostrar las 10 más cercanas
        // dentro de 800 metros

        const cercanas =
          paradasConDistancia
            .filter(
              item =>
                item.distancia <= 800
            )
            .slice(0, 10);


        console.log(
          "Paradas cercanas:",
          cercanas
        );


        // Crear marcadores

        cercanas.forEach(item => {

          const parada =
            item.parada;


          const marker =
            L.marker(
              [item.lat, item.lon],
              {
                icon: stopIcon
              }
            ).addTo(map);


          const distanciaTexto =
            item.distancia < 1000

              ? Math.round(item.distancia) +
                " m"

              : (
                  item.distancia / 1000
                ).toFixed(1) +
                " km";


          marker.bindPopup(`

            <div class="stop-popup">

              <strong>
                🚏 Parada ${parada.busstopId}
              </strong>

              <br><br>

              <b>Ubicación:</b><br>

              ${parada.street1 || ""}

              ${parada.street2
                ? " y " + parada.street2
                : ""
              }

              <br><br>

              <b>Distancia:</b>
              ${distanciaTexto}

              <br><br>

              <span>
                Tocá la parada para ver
                sus líneas.
              </span>

            </div>

          `);


          // Cuando el usuario toca
          // una parada, obtenemos sus líneas

          marker.on(
            "click",
            function() {

              cargarLineasParada(
                parada.busstopId,
                marker,
                parada
              );

            }
          );


          stopMarkers.push(marker);

        });


        if (cercanas.length === 0) {

          alert(
            "No encontramos paradas " +
            "a menos de 800 metros."
          );

        }


      } catch (error) {

        console.error(
          "Error buscando paradas:",
          error
        );


        alert(
          "No pudimos cargar las paradas."
        );

      }

    }


    // ==========================================
    // OBTENER LÍNEAS DE UNA PARADA
    // ==========================================

    async function cargarLineasParada(
      busstopId,
      marker,
      parada
    ) {

      try {

        marker.setPopupContent(`
          <div class="stop-popup">
            🚏 <strong>Parada ${busstopId}</strong>
            <br><br>
            Buscando líneas...
          </div>
        `);


        const respuesta =
          await fetch(
            API_BASE +
            '/stops/' +
            busstopId +
            '/lines'
          );


        if (!respuesta.ok) {

          throw new Error(
            "Error HTTP " +
            respuesta.status
          );

        }


        const lineas =
          await respuesta.json();


        console.log(
          "Líneas de parada",
          busstopId,
          lineas
        );


        let html = `

          <div class="stop-popup">

            <strong>
              🚏 Parada ${busstopId}
            </strong>

            <br><br>

            <b>
              ${parada.street1 || ""}
            </b>

        `;


        if (
          parada.street2
        ) {

          html += `
            <br>
            ${parada.street2}
          `;

        }


        html += `
          <br><br>

          <b>Líneas:</b>
          <br>
        `;


        if (
          lineas.length === 0
        ) {

          html += `
            No encontramos líneas.
          `;

        } else {

          lineas.forEach(linea => {

            html += `
              🚌 Línea
              <strong>
                ${linea.line}
              </strong>
              <br>
            `;

          });

        }


        html += `
          </div>
        `;


        marker.setPopupContent(
          html
        );

        marker.openPopup();


      } catch (error) {

        console.error(
          "Error obteniendo líneas:",
          error
        );


        marker.setPopupContent(`

          <div class="stop-popup">

            🚏 <strong>
              Parada ${busstopId}
            </strong>

            <br><br>

            No pudimos obtener
            las líneas.

          </div>

        `);

        marker.openPopup();

      }

    }


    // ==========================================
    // UBICACIÓN DEL USUARIO
    // ==========================================

    locationButton.addEventListener(
      "click",
      obtenerUbicacion
    );


    function obtenerUbicacion() {

      if (!navigator.geolocation) {

        alert(
          "Tu navegador no permite obtener ubicación."
        );

        return;
      }


      locationButton.disabled = true;

      locationButton.textContent =
        "📍 Buscando ubicación...";


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          console.log(
            "Latitud:",
            lat,
            "Longitud:",
            lon,
            "Precisión:",
            position.coords.accuracy,
            "metros"
          );


          // Crear o mover marcador

          if (userMarker) {

            userMarker.setLatLng(
              [lat, lon]
            );

          } else {

            userMarker =
              L.marker(
                [lat, lon]
              ).addTo(map);

          }


          userMarker.bindPopup(

            "📍 <strong>Estás acá</strong><br>" +

            "Precisión aproximada: " +

            Math.round(
              position.coords.accuracy
            ) +

            " metros"

          );


          userMarker.openPopup();


          // Centrar mapa

          map.setView(
            [lat, lon],
            16
          );


          // Buscar paradas

          await mostrarParadasCercanas(
            lat,
            lon
          );


          locationButton.disabled =
            false;

          locationButton.textContent =
            "📍 Actualizar mi ubicación";

        },


        function(error) {

          console.error(
            "Error de ubicación:",
            error
          );


          alert(
            "No pudimos obtener tu ubicación. " +
            "Asegurate de permitir el acceso a la ubicación."
          );


          locationButton.disabled =
            false;

          locationButton.textContent =
            "📍 Usar mi ubicación";

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }


    // ==========================================
    // BUSES EN TIEMPO REAL
    // ==========================================

    const markers =
      new Map();


    async function cargarBuses() {

      try {

        console.log(
          "Consultando buses..."
        );


        const respuesta =
          await fetch(
            API_BASE + '/buses'
          );


        if (!respuesta.ok) {

          throw new Error(
            "El servidor respondió con error " +
            respuesta.status
          );

        }


        const buses =
          await respuesta.json();


        console.log(
          "Buses recibidos:",
          buses.length
        );


        buses.forEach(bus => {

          if (
            !bus.location ||
            !bus.location.coordinates
          ) {

            return;

          }


          const longitud =
            bus.location.coordinates[0];

          const latitud =
            bus.location.coordinates[1];


          if (
            markers.has(bus.busId)
          ) {

            const marker =
              markers.get(
                bus.busId
              );


            marker.setLatLng(
              [latitud, longitud]
            );


            marker.setPopupContent(`

              <div class="bus-popup">

                <strong>
                  🚌 Línea ${bus.line}
                </strong>

                <br>

                <b>Empresa:</b>
                ${bus.company}

                <br>

                <b>Ómnibus:</b>
                ${bus.busId}

                <br>

                <b>Desde:</b>
                ${bus.origin}

                <br>

                <b>Hasta:</b>
                ${bus.destination}

                <br>

                <b>Velocidad:</b>
                ${bus.speed} km/h

              </div>

            `);

          }

          else {

            const marker =
              L.marker(
                [latitud, longitud],
                {
                  icon: busIcon
                }
              ).addTo(map);


            marker.bindPopup(`

              <div class="bus-popup">

                <strong>
                  🚌 Línea ${bus.line}
                </strong>

                <br>

                <b>Empresa:</b>
                ${bus.company}

                <br>

                <b>Ómnibus:</b>
                ${bus.busId}

                <br>

                <b>Desde:</b>
                ${bus.origin}

                <br>

                <b>Hasta:</b>
                ${bus.destination}

                <br>

                <b>Velocidad:</b>
                ${bus.speed} km/h

              </div>

            `);


            markers.set(
              bus.busId,
              marker
            );

          }

        });


      } catch (error) {

        console.error(
          "Error obteniendo buses:",
          error
        );

      }

    }


    // ==========================================
    // INICIO
    // ==========================================

    cargarBuses();

    setInterval(
      cargarBuses,
      15000
    );

  </script>

</body>
</html>
