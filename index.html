<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>¿Dónde Viene?</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --bg: #eef3f8;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --text: #172033;
      --muted: #667085;
      --border: #e4e9f0;
      --primary: #1769e0;
      --primary-dark: #0f4fb2;
      --primary-soft: #eaf2ff;
      --success: #138a55;
      --success-soft: #e9f8f0;
      --orange: #f47b20;
      --danger: #c62828;
      --danger-soft: #fff0f0;
      --shadow-sm: 0 2px 8px rgba(20, 36, 64, 0.07);
      --shadow-md: 0 12px 32px rgba(20, 36, 64, 0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background:
        linear-gradient(180deg, #0e1d33 0 190px, var(--bg) 190px 100%);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 22px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 23px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
    }

    .brand-text {
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 29px);
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.68);
    }

    #btnUbicacion {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.12);
      color: white;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    #btnUbicacion:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    #btnUbicacion:active {
      transform: translateY(0);
    }

    #btnUbicacion:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 70px;
    }

    .map-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #dce5ee;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.48);
    }

    #mapa {
      width: 100%;
      height: min(56vh, 590px);
      min-height: 390px;
    }

    .map-legend {
      position: absolute;
      z-index: 500;
      left: 14px;
      bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-width: calc(100% - 28px);
      padding: 8px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid rgba(218, 225, 234, 0.9);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 7px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      color: #475467;
      background: rgba(247, 249, 252, 0.9);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .legend-user {
      background: #1976d2;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.17);
    }

    .legend-stop {
      background: #1769e0;
    }

    .legend-bus {
      background: var(--orange);
    }

    #panel {
      position: relative;
      z-index: 20;
      width: min(980px, calc(100% - 48px));
      margin: 24px auto 0;
      padding: 24px 24px clamp(180px, 28vh, 280px);
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(228, 233, 240, 0.95);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(10px);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .panel-heading-copy h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.3px;
    }

    .panel-heading-copy p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--success);
      background: var(--success-soft);
      border: 1px solid #cfeedd;
    }

    .live-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(19, 138, 85, 0.12);
    }

    #paradaSeleccionada,
    #listaLineas,
    #proximos {
      scroll-margin-top: 18px;
    }

    #estado {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border-radius: 10px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .section-label {
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .section-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    #paradaSeleccionada {
      margin: 0 0 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #eef5ff, #f7faff);
      border: 1px solid #d7e6fb;
      color: #173a6a;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
    }

    #listaParadas {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }

    .parada {
      width: 100%;
      min-height: 70px;
      text-align: left;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(20, 36, 64, 0.03);
      transition:
        transform 0.16s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
    }

    .parada:hover {
      transform: translateY(-1px);
      border-color: #bfd3ef;
      background: #fbfdff;
      box-shadow: 0 6px 16px rgba(20, 36, 64, 0.07);
    }

    .parada:focus-visible {
      outline: 3px solid rgba(23, 105, 224, 0.18);
      outline-offset: 2px;
    }

    .parada strong {
      display: block;
      margin-bottom: 6px;
      color: #23314d;
      font-size: 14px;
      line-height: 1.35;
    }

    .parada span {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 999px;
      background: #f2f5f9;
      color: #667085;
      font-size: 12px;
      font-weight: 700;
    }

    #listaLineas {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    .linea {
      min-height: 46px;
      border: 1px solid #cfe0f8;
      background: #f4f8fe;
      color: var(--primary-dark);
      padding: 9px 13px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(20, 36, 64, 0.03);
      transition:
        transform 0.16s ease,
        background 0.16s ease,
        color 0.16s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease;
    }

    .linea:hover {
      transform: translateY(-1px);
      background: #eaf2ff;
      border-color: #a9c8f2;
      box-shadow: 0 5px 13px rgba(23, 105, 224, 0.1);
    }

    .linea:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .linea.seleccionada {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 7px 18px rgba(23, 105, 224, 0.23);
    }

    .linea-contenido {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
    }

    .linea-destino {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
    }

    #proximos {
      margin-top: 12px;
    }

    #proximos > h3 {
      margin: 8px 0 12px;
      font-size: 17px;
      color: #344054;
    }

    .bus {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 17px 15px 20px;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff, #fcfdff);
      box-shadow: 0 4px 14px rgba(20, 36, 64, 0.055);
    }

    .bus::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--primary);
    }

    .bus-principal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .bus-linea {
      font-size: 21px;
      font-weight: 900;
      color: #1d2939;
      letter-spacing: -0.3px;
    }

    .bus-eta {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .bus-detalles {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .bus-distancia {
      display: inline-flex;
      margin-top: 9px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #fff7ed;
      color: #a94d0b;
      font-size: 12px;
      font-weight: 800;
    }

    .cargando {
      position: relative;
      color: var(--muted);
      padding: 13px 14px 13px 39px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .cargando::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 50%;
      width: 13px;
      height: 13px;
      margin-top: -8px;
      border: 2px solid #c7d5e7;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: girar 0.75s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #ffd5d5;
      padding: 13px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 13px;
    }

    .sin-buses,
    .aviso-info {
      color: #596579;
      background: #f7f9fc;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 13px;
    }

    .aviso-info {
      margin-bottom: 10px;
    }

    .icono-parada,
    .icono-bus-vivo {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      border-radius: 50%;
    }

    .icono-parada {
      width: 34px;
      height: 34px;
      background: var(--primary);
      box-shadow:
        0 0 0 3px rgba(23, 105, 224, 0.12),
        0 3px 9px rgba(0, 0, 0, 0.28);
      font-size: 16px;
      color: white;
    }

    .icono-usuario {
      width: 22px;
      height: 22px;
      background: #1976d2;
      border: 4px solid white;
      border-radius: 50%;
      box-shadow:
        0 0 0 4px rgba(25, 118, 210, 0.2),
        0 3px 9px rgba(0, 0, 0, 0.3);
    }

    .icono-bus-vivo {
      width: 38px;
      height: 38px;
      background: var(--orange);
      box-shadow:
        0 0 0 4px rgba(244, 123, 32, 0.17),
        0 3px 10px rgba(0, 0, 0, 0.3);
      font-size: 18px;
    }

    .leaflet-control-zoom a {
      color: #344054 !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(20, 36, 64, 0.18);
    }

    .leaflet-popup-content {
      margin: 14px 16px;
      line-height: 1.45;
    }

    .leaflet-popup-content button {
      border: 0;
      padding: 8px 11px;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      body {
        background:
          linear-gradient(180deg, #0e1d33 0 165px, var(--bg) 165px 100%);
      }

      header {
        padding: 16px 16px 13px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .brand-subtitle {
        display: none;
      }

      #btnUbicacion {
        min-height: 40px;
        padding: 9px 12px;
        font-size: 13px;
      }

      .app-shell {
        width: min(100% - 20px, 1180px);
        padding-bottom: 35px;
      }

      .map-card {
        border-radius: 18px;
      }

      #mapa {
        height: 48vh;
        min-height: 330px;
      }

      .map-legend {
        left: 9px;
        bottom: 9px;
        max-width: calc(100% - 18px);
      }

      .legend-item {
        font-size: 11px;
      }

      #panel {
        width: calc(100% - 12px);
        margin-top: 16px;
        padding: 19px 15px 180px;
        border-radius: 18px;
      }

      .panel-heading {
        margin-bottom: 14px;
      }

      .panel-heading-copy h2 {
        font-size: 18px;
      }

      .panel-heading-copy p {
        font-size: 12px;
      }

      .live-badge {
        display: none;
      }

      #listaParadas {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .parada {
        min-height: 62px;
      }

      #paradaSeleccionada {
        font-size: 16px;
      }

      #listaLineas {
        gap: 7px;
      }

      .linea {
        min-height: 43px;
        padding: 8px 11px;
        font-size: 14px;
      }

      .linea-destino {
        max-width: 185px;
      }

      .bus {
        padding: 14px 13px 13px 17px;
      }

      .bus-principal {
        align-items: flex-start;
      }

      .bus-linea {
        font-size: 19px;
      }

      .bus-eta {
        font-size: 16px;
      }
    }

    @media (max-width: 430px) {
      header {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      #btnUbicacion {
        width: 100%;
      }

      #mapa {
        height: 44vh;
        min-height: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚌</div>

      <div class="brand-text">
        <h1>¿Dónde Viene?</h1>
        <div class="brand-subtitle">
          Transporte en tiempo real · Montevideo
        </div>
      </div>
    </div>

    <button id="btnUbicacion">
      📍 Usar mi ubicación
    </button>
  </header>


  <main class="app-shell">

    <div class="map-card">
      <div id="mapa"></div>

      <div class="map-legend" aria-hidden="true">
        <span class="legend-item">
          <span class="legend-dot legend-user"></span>
          Vos
        </span>

        <span class="legend-item">
          <span class="legend-dot legend-stop"></span>
          Parada
        </span>

        <span class="legend-item">
          <span class="legend-dot legend-bus"></span>
          Bus en vivo
        </span>
      </div>
    </div>


    <section id="panel">

      <div class="panel-heading">
        <div class="panel-heading-copy">
          <h2>Paradas cerca tuyo</h2>
          <p>
            Elegí una parada y después una línea para ver su llegada.
          </p>
        </div>

        <span class="live-badge">
          En vivo
        </span>
      </div>

      <div id="estado">
        Buscando paradas...
      </div>

      <div class="section-label">
        Parada seleccionada
      </div>

      <div id="paradaSeleccionada">
        Seleccioná una parada
      </div>

      <div class="section-label">
        Paradas cercanas
      </div>

      <div id="listaParadas"></div>

      <div class="section-label">
        Líneas
      </div>

      <div id="listaLineas"></div>

      <div class="section-label">
        Próximos buses
      </div>

      <div id="proximos"></div>

    </section>

  </main>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const API_BASE =
      'https://donde-viene-api.darriulatmaster.workers.dev';

    const RADIO_PARADAS = 2000;

    const CACHE_LINEAS_MS =
      5 * 60 * 1000;

    const INTERVALO_PROXIMOS_MS =
      30 * 1000;


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const estado =
      document.getElementById('estado');

    const paradaSeleccionada =
      document.getElementById('paradaSeleccionada');

    const listaParadas =
      document.getElementById('listaParadas');

    const listaLineas =
      document.getElementById('listaLineas');

    const proximos =
      document.getElementById('proximos');

    const btnUbicacion =
      document.getElementById('btnUbicacion');


    // =========================================================
    // ICONOS PERSONALIZADOS
    // =========================================================

    const iconoParada =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-parada">
            🚏
          </div>
        `,

        iconSize: [
          34,
          34
        ],

        iconAnchor: [
          17,
          17
        ],

        popupAnchor: [
          0,
          -18
        ]

      });


    const iconoUsuario =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-usuario"></div>
        `,

        iconSize: [
          22,
          22
        ],

        iconAnchor: [
          11,
          11
        ]

      });


    const iconoBusVivo =
      L.divIcon({

        className: '',

        html: `
          <div class="icono-bus-vivo">🚌</div>
        `,

        iconSize: [
          38,
          38
        ],

        iconAnchor: [
          19,
          19
        ],

        popupAnchor: [
          0,
          -21
        ]

      });


    // =========================================================
    // MAPA
    // =========================================================

    const mapa =
      L.map('mapa').setView(
        [-34.9011, -56.1645],
        13
      );


    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        attribution:
          'Tiles &copy; Esri'
      }
    ).addTo(mapa);


    // =========================================================
    // VARIABLES
    // =========================================================


    let todasLasParadas = [];

    let marcadorUsuario = null;

    let circuloUsuario = null;

    let marcadoresParadas = [];

    let marcadoresBusesVivos = [];

    let paradaActual = null;

    let lineaActual = null;

    let variantActual = null;

    // Solo puede existir un temporizador y una petición de próximos buses.
    let temporizadorProximos = null;

    let abortControllerProximos = null;

    // Cada cambio de parada o línea crea una nueva sesión.
    // Las respuestas de sesiones anteriores se ignoran.
    let sesionProximos = 0;

    let consultaLineasActual = 0;

    const cacheLineas =
      new Map();

    // Conserva brevemente el último resultado NO vacío de cada
    // parada/variante. La API oficial puede devolver [] de forma
    // puntual entre dos respuestas válidas.
    let cacheBusesEnVivo = {
      timestamp: 0,
      data: []
    };

    const CACHE_BUSES_EN_VIVO_MS =
      15 * 1000;

    // Historial de distancia por parada + variante + coche.
    // Solo usamos buses GPS sin ETA cuando podemos confirmar
    // que se están acercando a la parada seleccionada.
    const historialMovimientoBuses =
      new Map();

    const UMBRAL_ACERCAMIENTO_METROS =
      40;

    const HISTORIAL_MOVIMIENTO_MAX_MS =
      3 * 60 * 1000;



    // =========================================================
    // CARGAR TODAS LAS PARADAS
    // =========================================================

    async function cargarParadas() {

      estado.textContent =
        'Cargando paradas...';

      try {

        const respuesta =
          await fetch(
            `${API_BASE}/stops`
          );

        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }

        const datos =
          await respuesta.json();

        if (!Array.isArray(datos)) {
          throw new Error(
            'La API no devolvió una lista de paradas'
          );
        }

        todasLasParadas =
          datos;

        estado.textContent =
          `Se cargaron ${datos.length} paradas.`;

      } catch (error) {

        console.error(
          'Error cargando paradas:',
          error
        );

        estado.innerHTML =
          `<div class="error">
            No se pudieron cargar las paradas.
          </div>`;
      }
    }


    // =========================================================
    // DISTANCIA
    // =========================================================

    function distanciaMetros(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad =
        Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 * Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }


    // =========================================================
    // PARADAS CERCANAS
    // =========================================================

    function obtenerParadasCercanas(
      lat,
      lon
    ) {

      const resultado = [];

      for (
        const parada of todasLasParadas
      ) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }

        const [
          paradaLon,
          paradaLat
        ] =
          parada.location.coordinates;

        const distancia =
          distanciaMetros(
            lat,
            lon,
            paradaLat,
            paradaLon
          );

        if (
          distancia <=
          RADIO_PARADAS
        ) {

          resultado.push({
            ...parada,
            distancia
          });
        }
      }

      resultado.sort(
        (a, b) =>
          a.distancia -
          b.distancia
      );

      return resultado.slice(
        0,
        15
      );
    }


    // =========================================================
    // MOSTRAR PARADAS EN LISTA
    // =========================================================

    function mostrarParadas(
      paradas
    ) {

      listaParadas.innerHTML =
        '';

      if (
        !paradas.length
      ) {

        listaParadas.innerHTML =
          `<div class="sin-buses">
            No encontramos paradas dentro de 2 km.
          </div>`;

        return;
      }


      for (
        const parada of paradas
      ) {

        const boton =
          document.createElement(
            'button'
          );

          'parada';

          ]

        `;


        boton.addEventListener(
          'click',

            )
        );


        listaParadas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // MOSTRAR MARCADORES
    // =========================================================

    function mostrarMarcadores(
      paradas
    ) {

      // Borrar marcadores anteriores

      for (
        const marcador of
        marcadoresParadas
      ) {

        mapa.removeLayer(
          marcador
        );
      }


      marcadoresParadas =
        [];


      // Crear nuevos

      for (
        const parada of paradas
      ) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }


        const [
          lon,
          lat
        ] =
          parada.location.coordinates;


        const marcador =
          L.marker(
            [
              lat,
              lon
            ],
            {
              icon:
                iconoParada
            }
          )
          .addTo(mapa);


        const nombre =
          [
            parada.street1,
            parada.street2
          ]
          .filter(Boolean)
          .join(' y ');


        marcador.bindPopup(`
          <strong>
            🚏 PARADA
          </strong>

          <br><br>

          ${nombre || 'Parada ' + parada.busstopId}

          <br><br>

          <button
            onclick="
              seleccionarParadaPorId(
                ${parada.busstopId}
              )
            "
          >
            Ver líneas
          </button>
        `);


        marcadoresParadas.push(
          marcador
        );
      }
    }


    // =========================================================
    // SELECCIONAR PARADA DESDE MARCADOR
    // =========================================================

    window.seleccionarParadaPorId =
      function(id) {

        const parada =
          todasLasParadas.find(
            p =>
              String(
                p.busstopId
              ) ===
              String(id)
          );


        if (
          parada
        ) {

          seleccionarParada(
            parada
          );
        }
      };




    // =========================================================
    // SCROLL SUAVE DE NAVEGACIÓN
    // =========================================================

    function scrollSuaveA(
      elemento,
      margen = 14
    ) {

      if (!elemento) {
        return;
      }


      // scrollIntoView funciona de forma consistente tanto
      // en escritorio como en celular.
      elemento.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });


      // Pequeño ajuste para que el contenido no quede
      // pegado al borde superior de la pantalla.
      setTimeout(() => {
        const top =
          elemento.getBoundingClientRect().top;

        if (Math.abs(top) < margen + 30) {
          window.scrollBy({
            top: -margen,
            behavior: 'smooth'
          });
        }
      }, 350);
    }


    // =========================================================
    // SELECCIONAR PARADA
    // =========================================================

    async function seleccionarParada(
      parada
    ) {

      paradaActual =
        parada;


      cancelarActualizacionProximos();


      lineaActual =
        null;

      variantActual =
        null;


      proximos.innerHTML =
        '';


      listaLineas.innerHTML =
        `<div class="cargando">
          Cargando líneas...
        </div>`;


      const nombre =
        [
          parada.street1,
          parada.street2
        ]
        .filter(Boolean)
        .join(' y ');


      paradaSeleccionada.textContent =
        `🚏 ${nombre || 'Parada ' + parada.busstopId}`;


      const consultaId =
        ++consultaLineasActual;


      try {

        const cache =
          cacheLineas.get(
            String(
              parada.busstopId
            )
          );


        let lineas;


        if (
          cache &&
          Date.now() -
          cache.timestamp <
          CACHE_LINEAS_MS
        ) {

          lineas =
            cache.data;

        } else {

          const respuesta =
            await fetch(
              `${API_BASE}/stops/${encodeURIComponent(parada.busstopId)}/lines`
            );


          if (
            !respuesta.ok
          ) {

            throw new Error(
              `HTTP ${respuesta.status}`
            );
          }


          lineas =
            await respuesta.json();


          cacheLineas.set(
            String(
              parada.busstopId
            ),
            {
              timestamp:
                Date.now(),

              data:
                lineas
            }
          );
        }


        // Intentamos enriquecer cada variante con su destino actual.
        // Si esta consulta falla, las líneas igual se muestran normalmente.
        try {
          const respuestaBuses =
            await fetch(
              `${API_BASE}/buses?busstopId=${encodeURIComponent(parada.busstopId)}`
            );

          if (respuestaBuses.ok) {
            const busesParada =
              await respuestaBuses.json();

            if (Array.isArray(busesParada)) {
              const infoPorVariante =
                new Map();

              for (const bus of busesParada) {
                if (bus.lineVariantId != null) {
                  infoPorVariante.set(
                    String(bus.lineVariantId),
                    bus
                  );
                }
              }

              lineas = lineas.map(linea => {
                const info =
                  infoPorVariante.get(
                    String(linea.lineVariantId)
                  );

                return {
                  ...linea,
                  destination:
                    linea.destination ||
                    info?.destination ||
                    '',
                  origin:
                    linea.origin ||
                    info?.origin ||
                    ''
                };
              });
            }
          }
        } catch (error) {
          console.warn(
            'No se pudo enriquecer el destino de las líneas:',
            error
          );
        }


        if (
          consultaId !==
          consultaLineasActual
        ) {

          return;
        }


        mostrarLineas(
          lineas
        );


        // Al elegir una parada, llevamos al usuario
        // directamente a las líneas disponibles.
        requestAnimationFrame(
          () =>
            scrollSuaveA(
              listaLineas
            )
        );


      } catch (error) {

        console.error(
          error
        );


        if (
          consultaId ===
          consultaLineasActual
        ) {

          listaLineas.innerHTML =
            `<div class="error">
              No se pudieron cargar las líneas.
            </div>`;
        }
      }
    }


    // =========================================================
    // MOSTRAR LÍNEAS
    // =========================================================

    function mostrarLineas(
      lineas
    ) {

      listaLineas.innerHTML =
        '';


      if (
        !Array.isArray(lineas) ||
        !lineas.length
      ) {

        listaLineas.innerHTML =
          `<div class="sin-buses">
            No encontramos líneas para esta parada.
          </div>`;

        return;
      }


      const lineasUnicas =
        [];

      const vistos =
        new Set();


      for (
        const linea of lineas
      ) {

        const clave =
          `${linea.line}-${linea.lineVariantId || ''}`;


        if (
          !vistos.has(
            clave
          )
        ) {

          vistos.add(
            clave
          );

          lineasUnicas.push(
            linea
          );
        }
      }


      for (
        const linea of
        lineasUnicas
      ) {

        const boton =
          document.createElement(
            'button'
          );


        boton.className =
          'linea';


        boton.innerHTML = `
          <span class="linea-contenido">
            <span>${linea.line}</span>
            ${
              linea.destination
                ? `<span class="linea-destino">→ ${linea.destination}</span>`
                : ''
            }
          </span>
        `;


        boton.addEventListener(
          'click',
          () =>
            seleccionarLinea(
              linea,
              boton
            )
        );


        listaLineas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // BUSES EN VIVO EN EL MAPA
    // =========================================================

    function limpiarMarcadoresBusesVivos() {

      for (
        const marcador of
        marcadoresBusesVivos
      ) {

        mapa.removeLayer(
          marcador
        );
      }

      marcadoresBusesVivos = [];
    }


    function mostrarMarcadoresBusesVivos(
      buses,
      seleccion
    ) {

      limpiarMarcadoresBusesVivos();

      if (!Array.isArray(buses)) {
        return;
      }

      const puntosParaEncuadrar = [];

      // La parada seleccionada también entra en el encuadre.
      // Así siempre vemos la relación entre la parada y los buses.
      if (
        Number.isFinite(Number(seleccion?.stopLat)) &&
        Number.isFinite(Number(seleccion?.stopLon))
      ) {
        puntosParaEncuadrar.push([
          Number(seleccion.stopLat),
          Number(seleccion.stopLon)
        ]);
      }

      for (const bus of buses) {

        if (
          !bus.location ||
          !Array.isArray(bus.location.coordinates)
        ) {
          continue;
        }

        const [lon, lat] =
          bus.location.coordinates;

        if (
          !Number.isFinite(Number(lat)) ||
          !Number.isFinite(Number(lon))
        ) {
          continue;
        }

        const latNumero = Number(lat);
        const lonNumero = Number(lon);

        const marcador =
          L.marker(
            [latNumero, lonNumero],
            {
              icon: iconoBusVivo,
              zIndexOffset: 1200
            }
          )
          .addTo(mapa);

        const distanciaTexto =
          Number.isFinite(Number(bus.distanciaAParada))
            ? `<br><strong>Aprox. ${formatearDistancia(bus.distanciaAParada)} de la parada</strong>`
            : Number.isFinite(Number(bus.distance))
              ? `<br><strong>${formatearDistancia(bus.distance)} de la parada</strong>`
              : '';

        const etaTexto =
          Number.isFinite(Number(bus.eta))
            ? `<br>Llegada estimada: <strong>${formatearETA(bus.eta)}</strong>`
            : '';

        marcador.bindPopup(`
          <strong>🚌 ${bus.line || seleccion?.linea || ''}</strong>
          ${bus.busId ? `<br>Coche ${bus.busId}` : ''}
          ${bus.destination || seleccion?.destination ? `<br>→ ${bus.destination || seleccion.destination}` : ''}
          ${etaTexto}
          ${distanciaTexto}
        `);

        marcadoresBusesVivos.push(
          marcador
        );

        // Usamos como máximo los 3 primeros buses para no alejar
        // demasiado el mapa si hay un vehículo muy remoto.
        if (puntosParaEncuadrar.length < 4) {
          puntosParaEncuadrar.push([
            latNumero,
            lonNumero
          ]);
        }
      }

      if (puntosParaEncuadrar.length >= 2) {
        mapa.fitBounds(
          L.latLngBounds(puntosParaEncuadrar),
          {
            padding: [45, 45],
            maxZoom: 15,
            animate: true
          }
        );
      } else if (puntosParaEncuadrar.length === 1) {
        mapa.setView(
          puntosParaEncuadrar[0],
          15,
          { animate: true }
        );
      }
    }


    // =========================================================
    // SELECCIONAR LÍNEA
    // =========================================================


    async function seleccionarLinea(
      linea,
      boton
    ) {

      if (
        !paradaActual
      ) {
        return;
      }


      const variantId =
        linea.lineVariantId;


      if (
        !variantId
      ) {

        proximos.innerHTML =
          `<div class="error">
            Esta línea no tiene un lineVariantId válido.
          </div>`;

        return;
      }


      // Cancelamos cualquier consulta/temporizador anterior.
      // El botón NO se deshabilita: si el usuario vuelve a tocar
      // la misma línea, esa acción inicia una consulta nueva.
      cancelarActualizacionProximos();


      lineaActual =
        linea.line;


      variantActual =
        variantId;


      const seleccion = {
        sesionId:
          sesionProximos,

        stopId:
          paradaActual.busstopId,

        variantId,

        linea:
          linea.line,

        destination:
          linea.destination || '',

        stopLon:
          paradaActual.location?.coordinates?.[0],

        stopLat:
          paradaActual.location?.coordinates?.[1]
      };


      document
        .querySelectorAll(
          '.linea'
        )
        .forEach(
          b =>
            b.classList.remove(
              'seleccionada'
            )
        );


      boton.classList.add(
        'seleccionada'
      );


      proximos.innerHTML =
        `<div class="cargando">
          🔄 Buscando próximos ${linea.line}...
        </div>`;


      // Al elegir una línea, llevamos al usuario
      // a la zona donde aparecerán los buses.
      requestAnimationFrame(
        () =>
          scrollSuaveA(
            proximos
          )
      );


      await cargarProximos(
        seleccion
      );


      if (
        seleccion.sesionId ===
          sesionProximos
      ) {

        programarActualizacionProximos(
          seleccion
        );
      }
    }



    // =========================================================
    // CANCELAR ACTUALIZACIÓN
    // =========================================================


    function cancelarActualizacionProximos() {

      // Invalida de inmediato cualquier respuesta anterior.
      sesionProximos++;

      // Al cambiar de parada o línea, quitamos del mapa
      // los vehículos de la selección anterior.
      limpiarMarcadoresBusesVivos();


      if (
        temporizadorProximos
      ) {

        clearTimeout(
          temporizadorProximos
        );

        temporizadorProximos =
          null;
      }


      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();

        abortControllerProximos =
          null;
      }
    }


    function programarActualizacionProximos(
      seleccion
    ) {

      if (
        seleccion.sesionId !==
        sesionProximos
      ) {

        return;
      }


      if (
        temporizadorProximos
      ) {

        clearTimeout(
          temporizadorProximos
        );
      }


      temporizadorProximos =
        setTimeout(
          async () => {

            temporizadorProximos =
              null;


            if (
              seleccion.sesionId !==
              sesionProximos
            ) {

              return;
            }


            await cargarProximos(
              seleccion
            );


            if (
              seleccion.sesionId ===
              sesionProximos
            ) {

              programarActualizacionProximos(
                seleccion
              );
            }

          },
          INTERVALO_PROXIMOS_MS
        );
    }



    // =========================================================
    // CARGAR PRÓXIMOS
    // =========================================================


    async function cargarProximos(
      seleccion
    ) {

      if (
        !seleccion ||
        seleccion.sesionId !==
          sesionProximos
      ) {

        return;
      }


      const {
        stopId,
        variantId,
        linea,
        sesionId
      } =
        seleccion;


      // Nunca dejamos dos peticiones de próximos buses activas.
      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();
      }


      const controller =
        new AbortController();


      abortControllerProximos =
        controller;


      try {

        const url =
          `${API_BASE}/stops/${encodeURIComponent(stopId)}/upcomingbuses` +
          `?lineVariantIds=${encodeURIComponent(variantId)}` +
          `&amountperline=3`;


        const respuesta =
          await fetch(
            url,
            {
              signal:
                controller.signal
            }
          );


        if (
          !respuesta.ok
        ) {

          if (
            respuesta.status ===
            429
          ) {

            throw new Error(
              'Demasiadas consultas. Esperá unos segundos.'
            );
          }


          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        const datos =
          await respuesta.json();


        if (
          sesionId !==
          sesionProximos
        ) {

          return;
        }


        const claveResultado =
          `${stopId}|${variantId}`;


        if (
          Array.isArray(datos) &&
          datos.length > 0
        ) {

          mostrarMarcadoresBusesVivos(
            datos,
            seleccion
          );

          mostrarProximos(
            datos,
            linea,
            seleccion.destination
          );

        } else {

          await mostrarBusesLejanos(
            seleccion
          );
        }

      } catch (error) {

        if (
          error.name ===
          'AbortError'
        ) {

          return;
        }


        console.error(
          error
        );


        if (
          sesionId ===
          sesionProximos
        ) {

          proximos.innerHTML =
            `<div class="error">
              No se pudieron consultar los próximos buses.
              <br>
              <small>
                ${error.message}
              </small>
            </div>`;
        }

      } finally {

        // Solo limpia el controlador si sigue siendo el de ESTA petición.
        // Así una petición vieja nunca borra el controlador de una nueva.
        if (
          abortControllerProximos ===
          controller
        ) {

          abortControllerProximos =
            null;
        }
      }
    }



    async function obtenerBusesEnVivo() {

      if (
        Date.now() -
          cacheBusesEnVivo.timestamp <
          CACHE_BUSES_EN_VIVO_MS &&
        Array.isArray(cacheBusesEnVivo.data)
      ) {
        return cacheBusesEnVivo.data;
      }

      const respuesta =
        await fetch(
          `${API_BASE}/buses`
        );

      if (!respuesta.ok) {
        throw new Error(
          `HTTP ${respuesta.status}`
        );
      }

      const datos =
        await respuesta.json();

      if (!Array.isArray(datos)) {
        return [];
      }

      cacheBusesEnVivo = {
        timestamp: Date.now(),
        data: datos
      };

      return datos;
    }


    function formatearDistancia(
      metros
    ) {

      const numero =
        Number(metros);

      if (!Number.isFinite(numero)) {
        return 'Sin distancia';
      }

      if (numero < 1000) {
        return `${Math.round(numero)} m`;
      }

      return `${(numero / 1000).toFixed(1).replace('.', ',')} km`;
    }


    async function mostrarBusesLejanos(
      seleccion
    ) {

      if (
        seleccion.sesionId !==
          sesionProximos
      ) {
        return;
      }

      const {
        stopId,
        variantId,
        linea,
        destination,
        stopLat,
        stopLon
      } = seleccion;

      proximos.innerHTML =
        `<div class="cargando">
          Verificando qué vehículos vienen hacia esta parada...
        </div>`;

      try {
        const buses =
          await obtenerBusesEnVivo();

        if (
          seleccion.sesionId !==
            sesionProximos
        ) {
          return;
        }

        const ahora =
          Date.now();

        // Limpiar observaciones demasiado antiguas.
        for (
          const [clave, observacion] of
            historialMovimientoBuses.entries()
        ) {
          if (
            ahora - observacion.timestamp >
              HISTORIAL_MOVIMIENTO_MAX_MS
          ) {
            historialMovimientoBuses.delete(
              clave
            );
          }
        }

        const busesMismaVariante =
          buses
            .filter(bus =>
              String(bus.lineVariantId) ===
                String(variantId) &&
              bus.location &&
              Array.isArray(bus.location.coordinates)
            )
            .map(bus => {
              const [lon, lat] =
                bus.location.coordinates;

              const distancia =
                Number.isFinite(Number(stopLat)) &&
                Number.isFinite(Number(stopLon))
                  ? distanciaMetros(
                      Number(stopLat),
                      Number(stopLon),
                      Number(lat),
                      Number(lon)
                    )
                  : null;

              return {
                ...bus,
                distanciaAParada: distancia
              };
            })
            .filter(bus =>
              Number.isFinite(
                Number(bus.distanciaAParada)
              )
            );

        const busesAcercandose = [];
        let busesSinConfirmar = 0;
        let busesAlejandose = 0;

        for (
          const bus of
            busesMismaVariante
        ) {
          const identificadorBus =
            bus.busId != null
              ? String(bus.busId)
              : `${bus.location.coordinates[0]}|${bus.location.coordinates[1]}`;

          const claveMovimiento =
            `${stopId}|${variantId}|${identificadorBus}`;

          const anterior =
            historialMovimientoBuses.get(
              claveMovimiento
            );

          const distanciaActual =
            Number(bus.distanciaAParada);

          let estadoMovimiento =
            'sin-confirmar';

          if (
            anterior &&
            Number.isFinite(
              Number(anterior.distancia)
            )
          ) {
            const diferencia =
              Number(anterior.distancia) -
              distanciaActual;

            if (
              diferencia >=
                UMBRAL_ACERCAMIENTO_METROS
            ) {
              estadoMovimiento =
                'acercandose';
            } else if (
              diferencia <=
                -UMBRAL_ACERCAMIENTO_METROS
            ) {
              estadoMovimiento =
                'alejandose';
            }
          }

          historialMovimientoBuses.set(
            claveMovimiento,
            {
              distancia:
                distanciaActual,

              timestamp:
                ahora
            }
          );

          if (
            estadoMovimiento ===
              'acercandose'
          ) {
            busesAcercandose.push({
              ...bus,
              estadoMovimiento
            });
          } else if (
            estadoMovimiento ===
              'alejandose'
          ) {
            busesAlejandose++;
          } else {
            busesSinConfirmar++;
          }
        }

        busesAcercandose.sort(
          (a, b) =>
            Number(a.distanciaAParada) -
            Number(b.distanciaAParada)
        );

        const destinoTexto =
          destination
            ? ` → ${destination}`
            : '';

        if (
          !busesMismaVariante.length
        ) {
          limpiarMarcadoresBusesVivos();

          proximos.innerHTML = `
            <h3>${linea}${destinoTexto}</h3>
            <div class="aviso-info">
              <strong>Sin llegada estimada por ahora.</strong><br>
              No hay vehículos de esta variante reportando posición en este momento.
            </div>
          `;
          return;
        }

        if (
          !busesAcercandose.length
        ) {
          limpiarMarcadoresBusesVivos();

          proximos.innerHTML = `
            <h3>${linea}${destinoTexto}</h3>
            <div class="aviso-info">
              <strong>Sin llegada estimada por ahora.</strong><br>
              ${
                busesSinConfirmar > 0
                  ? `Detectamos ${busesSinConfirmar} vehículo${busesSinConfirmar === 1 ? '' : 's'} de esta variante, pero todavía estamos verificando si viene${busesSinConfirmar === 1 ? '' : 'n'} hacia esta parada. La próxima actualización confirmará la dirección.`
                  : `Los vehículos detectados de esta variante parecen haberse alejado de esta parada, por lo que no los mostramos como próximos.`
              }
            </div>
          `;
          return;
        }

        mostrarMarcadoresBusesVivos(
          busesAcercandose,
          seleccion
        );

        proximos.innerHTML = `
          <h3>${linea}${destinoTexto}</h3>
          <div class="aviso-info">
            <strong>Sin ETA oficial por ahora.</strong><br>
            Mostramos únicamente vehículos cuya posición indica que se están acercando a esta parada.
            La distancia es aproximada y en línea recta.
          </div>
        `;

        for (
          const bus of
            busesAcercandose.slice(0, 3)
        ) {
          const elemento =
            document.createElement('div');

          elemento.className =
            'bus';

          elemento.innerHTML = `
            <div class="bus-principal">
              <div>
                <div class="bus-linea">
                  🚌 ${bus.line || linea}
                </div>
                <div class="bus-detalles">
                  ${bus.company || bus.companyName || ''}
                  ${bus.busId ? ' · Coche ' + bus.busId : ''}
                </div>
              </div>
              <div class="bus-eta">
                ${formatearDistancia(bus.distanciaAParada)}
              </div>
            </div>
            <div class="bus-detalles">
              ${bus.origin || ''}
              ${bus.origin || bus.destination ? ' → ' : ''}
              ${bus.destination || destination || ''}
            </div>
            <div class="bus-distancia">
              Acercándose · distancia aproximada a la parada
            </div>
          `;

          proximos.appendChild(
            elemento
          );
        }

      } catch (error) {
        console.error(
          'Error buscando buses en circulación:',
          error
        );

        if (
          seleccion.sesionId ===
            sesionProximos
        ) {
          limpiarMarcadoresBusesVivos();

          proximos.innerHTML = `
            <h3>${linea}${destination ? ` → ${destination}` : ''}</h3>
            <div class="aviso-info">
              <strong>Sin llegada estimada por ahora.</strong><br>
              No pudimos consultar la ubicación de los vehículos en circulación.
            </div>
          `;
        }
      }
    }


    // =========================================================
    // ETA
    // =========================================================

    function formatearETA(
      segundos
    ) {

      const numero =
        Number(
          segundos
        );


      if (
        !Number.isFinite(
          numero
        )
      ) {

        return 'Sin información';
      }


      if (
        numero <= 30
      ) {

        return 'Llegando';
      }


      const minutos =
        Math.round(
          numero / 60
        );


      if (
        minutos <= 1
      ) {

        return '1 min';
      }


      return `${minutos} min`;
    }


    // =========================================================
    // MOSTRAR PRÓXIMOS
    // =========================================================

    function mostrarProximos(
      buses,
      lineaMostrada,
      destinoMostrado = ''
    ) {

      if (
        !Array.isArray(
          buses
        ) ||
        !buses.length
      ) {

        proximos.innerHTML =
          `<div class="sin-buses">
            Sin llegada estimada por ahora.
          </div>`;

        return;
      }


      const ordenados =
        [...buses].sort(
          (a, b) =>
            Number(
              a.eta || 999999
            ) -
            Number(
              b.eta || 999999
            )
        );


      proximos.innerHTML =
        `<h3>
          Próximos ${lineaMostrada}${destinoMostrado ? ` → ${destinoMostrado}` : ''}
        </h3>`;


      for (
        const bus of
        ordenados
      ) {

        const elemento =
          document.createElement(
            'div'
          );


        elemento.className =
          'bus';


        const eta =
          formatearETA(
            bus.eta
          );


        elemento.innerHTML = `
          <div class="bus-principal">

            <div>

              <div class="bus-linea">
                🚌 ${bus.line || lineaMostrada}
              </div>

              <div class="bus-detalles">
                ${bus.companyName || ''}
                ${bus.busId ? ' · Coche ' + bus.busId : ''}
              </div>

            </div>

            <div class="bus-eta">
              ${eta}
            </div>

          </div>

          <div class="bus-detalles">
            ${bus.origin || ''}
            →
            ${bus.destination || ''}
          </div>

          <div class="bus-detalles">
            ${bus.subline || ''}
          </div>

          <div class="bus-detalles">
            ${bus.access || 'Sin datos'}
            ·
            ${bus.thermalConfort || 'Sin datos'}
          </div>

          ${
            Number.isFinite(Number(bus.distance))
              ? `<div class="bus-distancia">
                  Distancia informada: ${formatearDistancia(bus.distance)}
                </div>`
              : ''
          }
        `;


        proximos.appendChild(
          elemento
        );
      }
    }


    // =========================================================
    // GEOLOCALIZACIÓN
    // =========================================================

    function obtenerUbicacion() {

      if (
        !navigator.geolocation
      ) {

        estado.innerHTML =
          `<div class="error">
            Tu navegador no permite obtener la ubicación.
          </div>`;

        return;
      }


      btnUbicacion.disabled =
        true;


      btnUbicacion.textContent =
        '📍 Buscando...';


      estado.textContent =
        'Obteniendo tu ubicación...';


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;


          const lon =
            position.coords.longitude;


          // ==========================================
          // MARCADOR DEL USUARIO
          // ==========================================

          if (
            marcadorUsuario
          ) {

            mapa.removeLayer(
              marcadorUsuario
            );
          }


          marcadorUsuario =
            L.marker(
              [
                lat,
                lon
              ],
              {
                icon:
                  iconoUsuario,

                zIndexOffset:
                  1000
              }
            )
            .addTo(mapa);


          marcadorUsuario.bindPopup(
            `
              <strong>
                📍 TU UBICACIÓN
              </strong>
            `
          );


          // ==========================================
          // CÍRCULO DE RADIO
          // ==========================================

          if (
            circuloUsuario
          ) {

            mapa.removeLayer(
              circuloUsuario
            );
          }


          circuloUsuario =
            L.circle(
              [
                lat,
                lon
              ],
              {
                radius:
                  RADIO_PARADAS,

                color:
                  '#1976d2',

                fillColor:
                  '#1976d2',

                fillOpacity:
                  0.05,

                weight:
                  1
              }
            )
            .addTo(mapa);


          // ==========================================
          // CENTRAR MAPA
          // ==========================================

          mapa.setView(
            [
              lat,
              lon
            ],
            15
          );


          // ==========================================
          // BUSCAR PARADAS
          // ==========================================

          const cercanas =
            obtenerParadasCercanas(
              lat,
              lon
            );


          mostrarParadas(
            cercanas
          );


          mostrarMarcadores(
            cercanas
          );


          estado.textContent =
            `Encontramos ${cercanas.length} paradas cercanas.`;


          btnUbicacion.disabled =
            false;


          btnUbicacion.textContent =
            '📍 Actualizar ubicación';
        },


        function(error) {

          console.error(
            'Error geolocalización:',
            error
          );


          let mensaje =
            'No pudimos obtener tu ubicación.';


          if (
            error.code === 1
          ) {

            mensaje =
              'Permiso de ubicación denegado.';

          } else if (
            error.code === 2
          ) {

            mensaje =
              'No se pudo determinar tu ubicación.';

          } else if (
            error.code === 3
          ) {

            mensaje =
              'La ubicación tardó demasiado.';
          }


          estado.innerHTML =
            `<div class="error">
              ${mensaje}
            </div>`;


          btnUbicacion.disabled =
            false;


          btnUbicacion.textContent =
            '📍 Intentar nuevamente';
        },

        {
          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            30000
        }
      );
    }


    // =========================================================
    // BOTÓN UBICACIÓN
    // =========================================================

    btnUbicacion.addEventListener(
      'click',
      obtenerUbicacion
    );


    // =========================================================
    // INICIO
    // =========================================================

    async function iniciar() {

      await cargarParadas();

      obtenerUbicacion();
    }


    iniciar();

  </script>

</body>
</html>
