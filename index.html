<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¿Dónde Viene?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .boton-ubicacion {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .boton-ubicacion:hover {
      background: #1d4ed8;
    }

    .estado {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 500px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .paradas {
      display: grid;
      gap: 10px;
    }

    .parada {
      width: 100%;
      text-align: left;
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      transition: 0.15s;
    }

    .parada:hover {
      background: #f3f4f6;
    }

    .parada strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .distancia {
      color: #666;
      font-size: 13px;
    }

    .lineas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .boton-linea {
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton-linea:hover {
      background: #1d4ed8;
    }

    .boton-linea:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .bus {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }

    .bus-principal {
      font-size: 18px;
      font-weight: bold;
    }

    .bus-detalle {
      color: #555;
      font-size: 14px;
      margin-top: 4px;
    }

    .cargando {
      color: #666;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 8px;
      padding: 10px;
    }

    .vacio {
      color: #666;
      padding: 10px 0;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      #map {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚌 ¿Dónde Viene?</h1>
    <p>Encontrá las paradas y próximos ómnibus cerca tuyo</p>
  </header>

  <div class="contenedor">

    <button
      class="boton-ubicacion"
      id="btnUbicacion"
      onclick="usarMiUbicacion()"
    >
      📍 Usar mi ubicación
    </button>

    <div
      class="estado"
      id="estado"
    >
      Tocá el botón para buscar las paradas cercanas.
    </div>

    <div id="map"></div>

    <div class="panel">

      <h2>🚏 Paradas cercanas</h2>

      <div
        id="listaParadas"
        class="paradas"
      >
        <div class="vacio">
          Todavía no buscamos tu ubicación.
        </div>
      </div>

    </div>


    <div
      class="panel"
      id="panelParada"
      style="display:none;"
    >

      <h2 id="tituloParada">
        🚏 Parada
      </h2>

      <div
        id="infoParada"
        class="distancia"
      ></div>

      <h3>
        🚌 Líneas
      </h3>

      <div
        id="listaLineas"
        class="lineas"
      >
        <div class="cargando">
          Cargando líneas...
        </div>
      </div>

    </div>


    <div
      class="panel"
      id="panelProximos"
      style="display:none;"
    >

      <h2 id="tituloProximos">
        🚌 Próximos ómnibus
      </h2>

      <div
        id="listaProximos"
      >
        <div class="cargando">
          Seleccioná una línea.
        </div>
      </div>

    </div>

  </div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // ========================================================
    // CONFIGURACIÓN
    // ========================================================

    const API_BASE =
      'https://donde-viene-api.darriulatmaster.workers.dev';

    const RADIO_MAXIMO = 2000;

    const CACHE_LINEAS_MS =
      5 * 60 * 1000;

    const MINIMO_ENTRE_CONSULTAS_MS =
      1200;


    // ========================================================
    // VARIABLES
    // ========================================================

    let mapa;

    let marcadorUsuario = null;

    let circuloUsuario = null;

    let marcadoresParadas = [];

    let todasLasParadas = [];

    let cacheLineas = new Map();

    let ultimaConsultaLineas = 0;

    let consultaParadaId = 0;

    let paradaSeleccionada = null;

    let varianteSeleccionada = null;

    let intervaloProximos = null;


    // ========================================================
    // MAPA
    // ========================================================

    mapa = L.map('map').setView(
      [-34.9011, -56.1645],
      13
    );


    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        attribution:
          'Tiles &copy; Esri'
      }
    ).addTo(mapa);


    // ========================================================
    // UTILIDADES
    // ========================================================

    function escaparHTML(texto) {

      const div =
        document.createElement('div');

      div.textContent =
        texto ?? '';

      return div.innerHTML;
    }


    function distanciaMetros(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad =
        Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }


    function formatearDistancia(metros) {

      if (metros < 1000) {
        return `${Math.round(metros)} m`;
      }

      return `${(metros / 1000).toFixed(1)} km`;
    }


    function formatearETA(segundos) {

      if (
        segundos === null ||
        segundos === undefined ||
        isNaN(Number(segundos))
      ) {
        return 'Sin información';
      }

      segundos =
        Number(segundos);


      if (segundos <= 0) {
        return 'Llegando';
      }


      const minutos =
        Math.round(segundos / 60);


      if (minutos <= 0) {
        return 'Llegando';
      }


      if (minutos === 1) {
        return '1 min';
      }


      return `${minutos} min`;
    }


    // ========================================================
    // CARGAR PARADAS
    // ========================================================

    async function cargarParadas() {

      const estado =
        document.getElementById('estado');

      estado.textContent =
        '⏳ Cargando paradas...';


      try {

        const respuesta =
          await fetch(
            `${API_BASE}/stops`
          );


        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        todasLasParadas =
          await respuesta.json();


        estado.textContent =
          `✅ ${todasLasParadas.length} paradas cargadas. Usá tu ubicación para encontrar las más cercanas.`;


      } catch (error) {

        console.error(error);

        estado.innerHTML =
          '<span class="error">No pudimos cargar las paradas.</span>';
      }
    }


    cargarParadas();


    // ========================================================
    // UBICACIÓN
    // ========================================================

    function usarMiUbicacion() {

      const estado =
        document.getElementById('estado');

      const boton =
        document.getElementById('btnUbicacion');


      if (!navigator.geolocation) {

        estado.innerHTML =
          '<span class="error">Tu navegador no permite obtener la ubicación.</span>';

        return;
      }


      boton.disabled = true;

      boton.textContent =
        '📍 Obteniendo ubicación...';

      estado.textContent =
        '⏳ Buscando tu ubicación...';


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;

          const precision =
            position.coords.accuracy;


          mostrarUbicacion(
            lat,
            lon,
            precision
          );


          boton.disabled = false;

          boton.textContent =
            '📍 Actualizar mi ubicación';
        },


        function(error) {

          console.error(error);

          boton.disabled = false;

          boton.textContent =
            '📍 Intentar nuevamente';


          let mensaje =
            'No pudimos obtener tu ubicación.';


          if (error.code === 1) {
            mensaje =
              'El navegador no tiene permiso para acceder a tu ubicación.';
          }

          if (error.code === 2) {
            mensaje =
              'No se pudo determinar tu ubicación.';
          }

          if (error.code === 3) {
            mensaje =
              'La ubicación tardó demasiado en responder.';
          }


          estado.innerHTML =
            `<span class="error">${mensaje}</span>`;
        },


        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }


    // ========================================================
    // MOSTRAR UBICACIÓN
    // ========================================================

    function mostrarUbicacion(
      lat,
      lon,
      precision
    ) {

      if (marcadorUsuario) {
        mapa.removeLayer(
          marcadorUsuario
        );
      }


      if (circuloUsuario) {
        mapa.removeLayer(
          circuloUsuario
        );
      }


      marcadorUsuario =
        L.marker([
          lat,
          lon
        ])
        .addTo(mapa)
        .bindPopup(
          '📍 Estás acá'
        );


      circuloUsuario =
        L.circle(
          [lat, lon],
          {
            radius: precision,
            color: '#2563eb',
            fillOpacity: 0.12
          }
        )
        .addTo(mapa);


      mapa.setView(
        [lat, lon],
        15
      );


      const estado =
        document.getElementById('estado');


      estado.textContent =
        `📍 Ubicación encontrada. Precisión aproximada: ${Math.round(precision)} m`;


      mostrarParadasCercanas(
        lat,
        lon
      );
    }


    // ========================================================
    // PARADAS CERCANAS
    // ========================================================

    function mostrarParadasCercanas(
      lat,
      lon
    ) {

      const lista =
        document.getElementById(
          'listaParadas'
        );


      if (
        !Array.isArray(
          todasLasParadas
        ) ||
        todasLasParadas.length === 0
      ) {

        lista.innerHTML =
          '<div class="vacio">Todavía no se cargaron las paradas.</div>';

        return;
      }


      const paradasCercanas =
        todasLasParadas
          .map(
            parada => {

              const coordenadas =
                parada.location?.coordinates;


              if (
                !coordenadas ||
                coordenadas.length < 2
              ) {
                return null;
              }


              const lonParada =
                coordenadas[0];

              const latParada =
                coordenadas[1];


              const distancia =
                distanciaMetros(
                  lat,
                  lon,
                  latParada,
                  lonParada
                );


              return {
                ...parada,
                distancia
              };
            }
          )
          .filter(
            parada =>
              parada &&
              parada.distancia <= RADIO_MAXIMO
          )
          .sort(
            (a, b) =>
              a.distancia -
              b.distancia
          )
          .slice(0, 15);


      limpiarMarcadoresParadas();


      if (
        paradasCercanas.length === 0
      ) {

        lista.innerHTML =
          '<div class="vacio">No encontramos paradas dentro de 2 km.</div>';

        return;
      }


      lista.innerHTML = '';


      paradasCercanas.forEach(
        parada => {

          const boton =
            document.createElement(
              'button'
            );


          boton.className =
            'parada';


          const nombre =
            `${parada.street1 || ''} ${parada.street2 || ''}`
              .trim();


          boton.innerHTML = `
            <strong>🚏 ${escaparHTML(nombre || 'Parada')}</strong>
            <span class="distancia">
              ${formatearDistancia(parada.distancia)}
              · ID ${escaparHTML(parada.busstopId)}
            </span>
          `;


          boton.onclick =
            () => seleccionarParada(
              parada
            );


          lista.appendChild(
            boton
          );


          // ----------------------------------------------
          // MARCADOR EN MAPA
          // ----------------------------------------------

          const coordenadas =
            parada.location.coordinates;


          const marcador =
            L.marker([
              coordenadas[1],
              coordenadas[0]
            ])
            .addTo(mapa)
            .bindPopup(
              `<strong>🚏 ${escaparHTML(nombre || 'Parada')}</strong><br>${formatearDistancia(parada.distancia)}`
            );


          marcador.on(
            'click',
            () => seleccionarParada(
              parada
            )
          );


          marcadoresParadas.push(
            marcador
          );
        }
      );


      const estado =
        document.getElementById(
          'estado'
        );


      estado.textContent =
        `🚏 Encontramos ${paradasCercanas.length} paradas dentro de ${RADIO_MAXIMO / 1000} km.`;
    }


    function limpiarMarcadoresParadas() {

      marcadoresParadas.forEach(
        marcador => {
          mapa.removeLayer(
            marcador
          );
        }
      );


      marcadoresParadas = [];
    }


    // ========================================================
    // SELECCIONAR PARADA
    // ========================================================

    async function seleccionarParada(
      parada
    ) {

      paradaSeleccionada =
        parada;


      varianteSeleccionada =
        null;


      consultaParadaId++;


      const consultaActual =
        consultaParadaId;


      if (intervaloProximos) {

        clearInterval(
          intervaloProximos
        );

        intervaloProximos =
          null;
      }


      const panelParada =
        document.getElementById(
          'panelParada'
        );


      const panelProximos =
        document.getElementById(
          'panelProximos'
        );


      const titulo =
        document.getElementById(
          'tituloParada'
        );


      const info =
        document.getElementById(
          'infoParada'
        );


      const listaLineas =
        document.getElementById(
          'listaLineas'
        );


      const nombre =
        `${parada.street1 || ''} ${parada.street2 || ''}`
          .trim();


      titulo.textContent =
        `🚏 ${nombre || 'Parada'}`;


      info.textContent =
        `ID de parada: ${parada.busstopId}`;


      listaLineas.innerHTML =
        '<div class="cargando">⏳ Cargando líneas...</div>';


      panelParada.style.display =
        'block';


      panelProximos.style.display =
        'none';


      panelParada.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });


      await cargarLineas(
        parada.busstopId,
        consultaActual
      );
    }


    // ========================================================
    // CARGAR LÍNEAS
    // ========================================================

    async function cargarLineas(
      stopId,
      consultaActual
    ) {

      const lista =
        document.getElementById(
          'listaLineas'
        );


      const ahora =
        Date.now();


      // ----------------------------------------------
      // CACHÉ LOCAL
      // ----------------------------------------------

      const cache =
        cacheLineas.get(
          String(stopId)
        );


      if (
        cache &&
        ahora - cache.timestamp <
          CACHE_LINEAS_MS
      ) {

        renderizarLineas(
          cache.data
        );

        return;
      }


      // ----------------------------------------------
      // EVITAR MUCHAS CONSULTAS SEGUIDAS
      // ----------------------------------------------

      const tiempoDesdeUltima =
        ahora -
        ultimaConsultaLineas;


      if (
        tiempoDesdeUltima <
        MINIMO_ENTRE_CONSULTAS_MS
      ) {

        const esperar =
          MINIMO_ENTRE_CONSULTAS_MS -
          tiempoDesdeUltima;


        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              esperar
            )
        );
      }


      ultimaConsultaLineas =
        Date.now();


      try {

        const respuesta =
          await fetch(
            `${API_BASE}/stops/${encodeURIComponent(stopId)}/lines`
          );


        if (
          consultaActual !==
          consultaParadaId
        ) {
          return;
        }


        if (
          respuesta.status === 429
        ) {

          lista.innerHTML =
            `<div class="error">
              La API está recibiendo muchas consultas.
              Esperá unos segundos y probá nuevamente.
            </div>`;

          return;
        }


        if (!respuesta.ok) {

          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        const lineas =
          await respuesta.json();


        cacheLineas.set(
          String(stopId),
          {
            timestamp:
              Date.now(),

            data:
              lineas
          }
        );


        renderizarLineas(
          lineas
        );


      } catch (error) {

        console.error(error);


        lista.innerHTML =
          `<div class="error">
            No pudimos cargar las líneas.
          </div>`;
      }
    }


    // ========================================================
    // MOSTRAR LÍNEAS
    // ========================================================

    function renderizarLineas(
      lineas
    ) {

      const lista =
        document.getElementById(
          'listaLineas'
        );


      lista.innerHTML = '';


      if (
        !Array.isArray(lineas) ||
        lineas.length === 0
      ) {

        lista.innerHTML =
          '<div class="vacio">No encontramos líneas para esta parada.</div>';

        return;
      }


      lineas.forEach(
        linea => {

          const boton =
            document.createElement(
              'button'
            );


          boton.className =
            'boton-linea';


          boton.textContent =
            linea.line;


          boton.onclick =
            () => seleccionarLinea(
              linea
            );


          lista.appendChild(
            boton
          );
        }
      );
    }


    // ========================================================
    // SELECCIONAR LÍNEA
    // ========================================================

    async function seleccionarLinea(
      linea
    ) {

      // ------------------------------------------------------
      // MUY IMPORTANTE:
      // ahora usamos lineVariantId
      // ------------------------------------------------------

      varianteSeleccionada =
        linea;


      const panel =
        document.getElementById(
          'panelProximos'
        );


      const titulo =
        document.getElementById(
          'tituloProximos'
        );


      const lista =
        document.getElementById(
          'listaProximos'
        );


      titulo.textContent =
        `🚌 Próximos ${linea.line}`;


      lista.innerHTML =
        '<div class="cargando">⏳ Buscando próximos ómnibus...</div>';


      panel.style.display =
        'block';


      panel.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });


      // Primera consulta
      await cargarProximos();


      // ------------------------------------------------------
      // ACTUALIZAR CADA 30 SEGUNDOS
      // ------------------------------------------------------

      if (intervaloProximos) {

        clearInterval(
          intervaloProximos
        );
      }


      intervaloProximos =
        setInterval(
          cargarProximos,
          30000
        );
    }


    // ========================================================
    // CARGAR PRÓXIMOS ÓMNIBUS
    // ========================================================

    async function cargarProximos() {

      if (
        !paradaSeleccionada ||
        !varianteSeleccionada
      ) {
        return;
      }


      const stopId =
        paradaSeleccionada.busstopId;


      const variantId =
        varianteSeleccionada.lineVariantId;


      if (!variantId) {

        console.error(
          'La línea no tiene lineVariantId',
          varianteSeleccionada
        );


        document.getElementById(
          'listaProximos'
        ).innerHTML =
          `<div class="error">
            Esta línea no tiene una variante disponible.
          </div>`;

        return;
      }


      const lista =
        document.getElementById(
          'listaProximos'
        );


      try {

        const url =
          `${API_BASE}/stops/${encodeURIComponent(stopId)}/upcomingbuses` +
          `?lineVariantIds=${encodeURIComponent(variantId)}` +
          `&amountperline=3`;


        console.log(
          'Consultando próximos buses:',
          url
        );


        const respuesta =
          await fetch(url);


        if (
          respuesta.status === 429
        ) {

          lista.innerHTML =
            `<div class="error">
              La API está recibiendo muchas consultas.
              Esperá unos segundos.
            </div>`;

          return;
        }


        if (!respuesta.ok) {

          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        const buses =
          await respuesta.json();


        renderizarProximos(
          buses
        );


      } catch (error) {

        console.error(error);


        lista.innerHTML =
          `<div class="error">
            No pudimos cargar los próximos ómnibus.
          </div>`;
      }
    }


    // ========================================================
    // MOSTRAR PRÓXIMOS
    // ========================================================

    function renderizarProximos(
      buses
    ) {

      const lista =
        document.getElementById(
          'listaProximos'
        );


      lista.innerHTML = '';


      if (
        !Array.isArray(buses) ||
        buses.length === 0
      ) {

        lista.innerHTML =
          `<div class="vacio">
            No hay próximos ómnibus disponibles en este momento.
          </div>`;

        return;
      }


      // Ordenar por ETA
      buses.sort(
        (a, b) =>
          Number(a.eta ?? Infinity) -
          Number(b.eta ?? Infinity)
      );


      buses.slice(
        0,
        3
      ).forEach(
        bus => {

          const elemento =
            document.createElement(
              'div'
            );


          elemento.className =
            'bus';


          const eta =
            formatearETA(
              bus.eta
            );


          const destino =
            bus.destination ||
            'Destino no disponible';


          const acceso =
            bus.access ||
            '';


          elemento.innerHTML = `
            <div class="bus-principal">
              🚌 ${escaparHTML(bus.line || '')}
              · ${escaparHTML(eta)}
            </div>

            <div class="bus-detalle">
              Hacia ${escaparHTML(destino)}
            </div>

            ${
              acceso
                ? `
                  <div class="bus-detalle">
                    ${escaparHTML(acceso)}
                  </div>
                `
                : ''
            }

            <div class="bus-detalle">
              Interno: ${escaparHTML(bus.busId)}
            </div>
          `;


          lista.appendChild(
            elemento
          );
        }
      );


      const actualizado =
        document.createElement(
          'div'
        );


      actualizado.className =
        'distancia';


      actualizado.style.marginTop =
        '10px';


      actualizado.textContent =
        `Actualizado: ${new Date().toLocaleTimeString('es-UY')}`;


      lista.appendChild(
        actualizado
      );
    }


    // ========================================================
    // LIMPIAR INTERVALO AL CERRAR / CAMBIAR
    // ========================================================

    window.addEventListener(
      'beforeunload',
      function() {

        if (intervaloProximos) {

          clearInterval(
            intervaloProximos
          );
        }
      }
    );


    // ========================================================
    // ACTUALIZACIÓN GENERAL DE BUSES
    // ========================================================
    //
    // Por ahora consultamos /buses cada 15 segundos.
    // Más adelante podemos usar esto para dibujar los
    // ómnibus en movimiento directamente sobre el mapa.
    //
    // ========================================================

    setInterval(
      async function() {

        try {

          const respuesta =
            await fetch(
              `${API_BASE}/buses`
            );


          if (!respuesta.ok) {
            return;
          }


          const buses =
            await respuesta.json();


          console.log(
            `🚌 Buses en tiempo real: ${
              Array.isArray(buses)
                ? buses.length
                : 0
            }`
          );


        } catch (error) {

          console.warn(
            'No se pudieron actualizar los buses',
            error
          );
        }

      },
      15000
    );

  </script>

</body>
</html>
