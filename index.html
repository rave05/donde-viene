<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>¿Dónde Viene?</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #btnUbicacion {
      border: none;
      background: #2e7d32;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnUbicacion:hover {
      background: #256628;
    }

    #mapa {
      width: 100%;
      height: 55vh;
      min-height: 350px;
    }

    #panel {
      background: white;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    #estado {
      margin-bottom: 15px;
      font-size: 15px;
      color: #555;
    }

    #paradaSeleccionada {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #listaParadas {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .parada {
      width: 100%;
      text-align: left;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
    }

    .parada:hover {
      background: #eee;
    }

    .parada strong {
      display: block;
      margin-bottom: 4px;
    }

    #listaLineas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .linea {
      border: none;
      background: #1565c0;
      color: white;
      padding: 11px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .linea:hover {
      background: #0d47a1;
    }

    .linea:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .linea.seleccionada {
      background: #0d47a1;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.2);
    }

    #proximos {
      margin-top: 15px;
    }

    .bus {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .bus-principal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .bus-linea {
      font-size: 22px;
      font-weight: bold;
    }

    .bus-eta {
      font-size: 22px;
      font-weight: bold;
      color: #1565c0;
      white-space: nowrap;
    }

    .bus-detalles {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .cargando {
      color: #666;
      padding: 10px 0;
    }

    .error {
      color: #b00020;
      background: #ffebee;
      padding: 12px;
      border-radius: 8px;
    }

    .sin-buses {
      color: #666;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      header h1 {
        text-align: center;
      }

      #btnUbicacion {
        width: 100%;
      }

      #mapa {
        height: 50vh;
      }

      #panel {
        padding: 15px;
      }

      .bus-principal {
        align-items: flex-start;
      }

      .bus-eta {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚌 ¿Dónde Viene?</h1>

    <button id="btnUbicacion">
      📍 Usar mi ubicación
    </button>
  </header>

  <div id="mapa"></div>

  <section id="panel">

    <div id="estado">
      Buscando paradas...
    </div>

    <div id="paradaSeleccionada">
      Seleccioná una parada
    </div>

    <div id="listaParadas"></div>

    <div id="listaLineas"></div>

    <div id="proximos"></div>

  </section>


  <!-- Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const API_BASE =
      'https://donde-viene-api.darriulatmaster.workers.dev';

    const RADIO_PARADAS = 2000;

    const CACHE_LINEAS_MS =
      5 * 60 * 1000;

    const CACHE_PROXIMOS_MS =
      8 * 1000;

    const INTERVALO_PROXIMOS_MS =
      30 * 1000;


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const estado =
      document.getElementById('estado');

    const paradaSeleccionada =
      document.getElementById('paradaSeleccionada');

    const listaParadas =
      document.getElementById('listaParadas');

    const listaLineas =
      document.getElementById('listaLineas');

    const proximos =
      document.getElementById('proximos');

    const btnUbicacion =
      document.getElementById('btnUbicacion');


    // =========================================================
    // MAPA
    // =========================================================

    const mapa =
      L.map('mapa').setView(
        [-34.9011, -56.1645],
        13
      );

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {
        attribution:
          'Tiles &copy; Esri'
      }
    ).addTo(mapa);


    // =========================================================
    // VARIABLES
    // =========================================================

    let todasLasParadas = [];

    let marcadorUsuario = null;

    let circuloUsuario = null;

    let marcadoresParadas = [];

    let paradaActual = null;

    let lineaActual = null;

    let variantActual = null;

    let intervaloProximos = null;

    let consultaProximosActual = 0;

    let abortControllerProximos = null;

    let consultaLineasActual = 0;

    let consultaLineasEnCurso = false;

    const cacheLineas =
      new Map();

    const cacheProximos =
      new Map();


    // =========================================================
    // CARGAR TODAS LAS PARADAS
    // =========================================================

    async function cargarParadas() {

      estado.textContent =
        'Cargando paradas...';

      try {

        const respuesta =
          await fetch(
            `${API_BASE}/stops`
          );

        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }

        const datos =
          await respuesta.json();

        if (!Array.isArray(datos)) {
          throw new Error(
            'La API no devolvió una lista de paradas'
          );
        }

        todasLasParadas = datos;

        estado.textContent =
          `Se cargaron ${datos.length} paradas.`;

      } catch (error) {

        console.error(
          'Error cargando paradas:',
          error
        );

        estado.innerHTML =
          `<div class="error">
            No se pudieron cargar las paradas.
          </div>`;
      }
    }


    // =========================================================
    // DISTANCIA ENTRE COORDENADAS
    // =========================================================

    function distanciaMetros(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad =
        Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 * Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }


    // =========================================================
    // BUSCAR PARADAS CERCANAS
    // =========================================================

    function obtenerParadasCercanas(
      lat,
      lon
    ) {

      const resultado = [];

      for (const parada of todasLasParadas) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }

        const [
          paradaLon,
          paradaLat
        ] = parada.location.coordinates;

        const distancia =
          distanciaMetros(
            lat,
            lon,
            paradaLat,
            paradaLon
          );

        if (
          distancia <= RADIO_PARADAS
        ) {

          resultado.push({
            ...parada,
            distancia
          });
        }
      }

      resultado.sort(
        (a, b) =>
          a.distancia - b.distancia
      );

      return resultado.slice(0, 15);
    }


    // =========================================================
    // MOSTRAR PARADAS
    // =========================================================

    function mostrarParadas(
      paradas
    ) {

      listaParadas.innerHTML = '';

      if (!paradas.length) {

        listaParadas.innerHTML =
          `<div class="sin-buses">
            No encontramos paradas dentro de 2 km.
          </div>`;

        return;
      }

      for (const parada of paradas) {

        const boton =
          document.createElement('button');

        boton.className =
          'parada';

        const calle1 =
          parada.street1 || '';

        const calle2 =
          parada.street2 || '';

        const nombre =
          [calle1, calle2]
            .filter(Boolean)
            .join(' y ');

        boton.innerHTML = `
          <strong>
            🚌 ${nombre || 'Parada ' + parada.busstopId}
          </strong>
          <span>
            ${Math.round(parada.distancia)} m
          </span>
        `;

        boton.addEventListener(
          'click',
          () => seleccionarParada(parada)
        );

        listaParadas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // MOSTRAR MARCADORES
    // =========================================================

    function mostrarMarcadores(
      paradas
    ) {

      for (
        const marcador of marcadoresParadas
      ) {
        mapa.removeLayer(
          marcador
        );
      }

      marcadoresParadas = [];

      for (const parada of paradas) {

        if (
          !parada.location ||
          !Array.isArray(
            parada.location.coordinates
          )
        ) {
          continue;
        }

        const [
          lon,
          lat
        ] = parada.location.coordinates;

        const marcador =
          L.marker([
            lat,
            lon
          ]).addTo(mapa);

        marcador.bindPopup(`
          <strong>
            ${parada.street1 || ''}
          </strong>
          <br>
          ${parada.street2 || ''}
          <br><br>
          <button
            onclick="seleccionarParadaPorId(${parada.busstopId})"
          >
            Ver líneas
          </button>
        `);

        marcadoresParadas.push(
          marcador
        );
      }
    }


    // =========================================================
    // SELECCIONAR PARADA DESDE MARCADOR
    // =========================================================

    window.seleccionarParadaPorId =
      function(id) {

        const parada =
          todasLasParadas.find(
            p =>
              String(p.busstopId) ===
              String(id)
          );

        if (parada) {
          seleccionarParada(parada);
        }
      };


    // =========================================================
    // SELECCIONAR PARADA
    // =========================================================

    async function seleccionarParada(
      parada
    ) {

      paradaActual =
        parada;

      // ---------------------------------------------
      // Cancelar cualquier consulta de próximos
      // ---------------------------------------------

      cancelarActualizacionProximos();

      lineaActual = null;
      variantActual = null;

      proximos.innerHTML = '';

      listaLineas.innerHTML =
        `<div class="cargando">
          Cargando líneas...
        </div>`;

      const nombre =
        [
          parada.street1,
          parada.street2
        ]
        .filter(Boolean)
        .join(' y ');

      paradaSeleccionada.textContent =
        `🚌 ${nombre || 'Parada ' + parada.busstopId}`;

      // ---------------------------------------------
      // Evitar consultas simultáneas
      // ---------------------------------------------

      const consultaId =
        ++consultaLineasActual;

      consultaLineasEnCurso = true;

      try {

        const cache =
          cacheLineas.get(
            String(parada.busstopId)
          );

        let lineas;

        if (
          cache &&
          Date.now() - cache.timestamp <
          CACHE_LINEAS_MS
        ) {

          lineas =
            cache.data;

        } else {

          const respuesta =
            await fetch(
              `${API_BASE}/stops/${encodeURIComponent(parada.busstopId)}/lines`
            );

          if (!respuesta.ok) {

            throw new Error(
              `HTTP ${respuesta.status}`
            );
          }

          lineas =
            await respuesta.json();

          cacheLineas.set(
            String(parada.busstopId),
            {
              timestamp: Date.now(),
              data: lineas
            }
          );
        }

        // Si entretanto se seleccionó
        // otra parada, ignoramos esta respuesta.
        if (
          consultaId !==
          consultaLineasActual
        ) {
          return;
        }

        mostrarLineas(lineas);

      } catch (error) {

        console.error(
          'Error cargando líneas:',
          error
        );

        if (
          consultaId ===
          consultaLineasActual
        ) {

          listaLineas.innerHTML =
            `<div class="error">
              No se pudieron cargar las líneas.
            </div>`;
        }

      } finally {

        if (
          consultaId ===
          consultaLineasActual
        ) {
          consultaLineasEnCurso = false;
        }
      }
    }


    // =========================================================
    // MOSTRAR LÍNEAS
    // =========================================================

    function mostrarLineas(
      lineas
    ) {

      listaLineas.innerHTML = '';

      if (
        !Array.isArray(lineas) ||
        !lineas.length
      ) {

        listaLineas.innerHTML =
          `<div class="sin-buses">
            No encontramos líneas para esta parada.
          </div>`;

        return;
      }

      // Evitar duplicados
      const lineasUnicas =
        [];

      const vistos =
        new Set();

      for (
        const linea of lineas
      ) {

        const variantId =
          linea.lineVariantId;

        const nombre =
          linea.line;

        const clave =
          `${nombre}-${variantId}`;

        if (
          !vistos.has(clave)
        ) {

          vistos.add(clave);

          lineasUnicas.push(
            linea
          );
        }
      }


      for (
        const linea of lineasUnicas
      ) {

        const boton =
          document.createElement('button');

        boton.className =
          'linea';

        boton.textContent =
          linea.line;

        boton.dataset.variantId =
          linea.lineVariantId || '';

        boton.addEventListener(
          'click',
          () => seleccionarLinea(
            linea,
            boton
          )
        );

        listaLineas.appendChild(
          boton
        );
      }
    }


    // =========================================================
    // SELECCIONAR LÍNEA
    // =========================================================

    async function seleccionarLinea(
      linea,
      boton
    ) {

      if (!paradaActual) {
        return;
      }

      const variantId =
        linea.lineVariantId;

      if (!variantId) {

        proximos.innerHTML =
          `<div class="error">
            Esta línea no tiene un lineVariantId válido.
          </div>`;

        return;
      }


      // ---------------------------------------------
      // Evitar doble clic mientras carga
      // ---------------------------------------------

      if (
        boton.disabled
      ) {
        return;
      }

      boton.disabled = true;


      // ---------------------------------------------
      // Cancelar completamente la consulta anterior
      // ---------------------------------------------

      cancelarActualizacionProximos();


      // ---------------------------------------------
      // Nueva línea actual
      // ---------------------------------------------

      lineaActual =
        linea.line;

      variantActual =
        variantId;


      // ---------------------------------------------
      // Marcar botón seleccionado
      // ---------------------------------------------

      document
        .querySelectorAll('.linea')
        .forEach(
          b => b.classList.remove(
            'seleccionada'
          )
        );

      boton.classList.add(
        'seleccionada'
      );


      // ---------------------------------------------
      // Cargar inmediatamente
      // ---------------------------------------------

      proximos.innerHTML =
        `<div class="cargando">
          🔄 Buscando próximos ${linea.line}...
        </div>`;


      try {

        await cargarProximos();

      } finally {

        boton.disabled = false;
      }


      // ---------------------------------------------
      // Crear UN SOLO intervalo
      // ---------------------------------------------

      if (
        lineaActual === linea.line &&
        variantActual === variantId &&
        paradaActual
      ) {

        intervaloProximos =
          setInterval(
            () => {

              if (
                paradaActual &&
                lineaActual === linea.line &&
                variantActual === variantId
              ) {

                cargarProximos();
              }

            },
            INTERVALO_PROXIMOS_MS
          );
      }
    }


    // =========================================================
    // CANCELAR REFRESCO
    // =========================================================

    function cancelarActualizacionProximos() {

      if (
        intervaloProximos
      ) {

        clearInterval(
          intervaloProximos
        );

        intervaloProximos =
          null;
      }


      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();

        abortControllerProximos =
          null;
      }

      // Invalidar consultas anteriores
      consultaProximosActual++;
    }


    // =========================================================
    // CARGAR PRÓXIMOS BUSES
    // =========================================================

    async function cargarProximos() {

      if (
        !paradaActual ||
        !variantActual
      ) {
        return;
      }


      const stopId =
        paradaActual.busstopId;

      const variantId =
        variantActual;


      const consultaId =
        ++consultaProximosActual;


      // ---------------------------------------------
      // Cancelar petición anterior
      // ---------------------------------------------

      if (
        abortControllerProximos
      ) {

        abortControllerProximos.abort();
      }

      abortControllerProximos =
        new AbortController();


      // ---------------------------------------------
      // Caché local
      // ---------------------------------------------

      const cacheKey =
        `${stopId}|${variantId}`;


      const cache =
        cacheProximos.get(
          cacheKey
        );


      if (
        cache &&
        Date.now() - cache.timestamp <
        CACHE_PROXIMOS_MS
      ) {

        if (
          consultaId ===
          consultaProximosActual
        ) {

          mostrarProximos(
            cache.data
          );
        }

        return;
      }


      try {

        const url =
          `${API_BASE}/stops/${encodeURIComponent(stopId)}/upcomingbuses` +
          `?lineVariantIds=${encodeURIComponent(variantId)}` +
          `&amountperline=3`;


        const respuesta =
          await fetch(
            url,
            {
              signal:
                abortControllerProximos.signal
            }
          );


        if (!respuesta.ok) {

          if (
            respuesta.status === 429
          ) {

            throw new Error(
              'La API recibió demasiadas consultas. Esperá unos segundos.'
            );
          }

          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }


        const datos =
          await respuesta.json();


        // -------------------------------------------
        // Ignorar respuesta vieja
        // -------------------------------------------

        if (
          consultaId !==
          consultaProximosActual
        ) {
          return;
        }


        // -------------------------------------------
        // Guardar caché
        // -------------------------------------------

        cacheProximos.set(
          cacheKey,
          {
            timestamp: Date.now(),
            data: datos
          }
        );


        mostrarProximos(
          datos
        );

      } catch (error) {

        // AbortError es normal cuando
        // cambiamos de línea/parada.
        if (
          error.name ===
          'AbortError'
        ) {
          return;
        }

        console.error(
          'Error cargando próximos:',
          error
        );


        if (
          consultaId ===
          consultaProximosActual
        ) {

          proximos.innerHTML =
            `<div class="error">
              No se pudieron consultar los próximos buses.<br>
              <small>${error.message}</small>
            </div>`;
        }

      } finally {

        if (
          consultaId ===
          consultaProximosActual
        ) {

          abortControllerProximos =
            null;
        }
      }
    }


    // =========================================================
    // FORMATEAR ETA
    // =========================================================

    function formatearETA(
      segundos
    ) {

      const numero =
        Number(segundos);

      if (
        !Number.isFinite(numero)
      ) {
        return 'Sin información';
      }


      if (
        numero <= 30
      ) {
        return 'Llegando';
      }


      const minutos =
        Math.round(
          numero / 60
        );


      if (
        minutos <= 1
      ) {
        return '1 min';
      }


      return `${minutos} min`;
    }


    // =========================================================
    // MOSTRAR PRÓXIMOS
    // =========================================================

    function mostrarProximos(
      buses
    ) {

      if (
        !Array.isArray(buses) ||
        !buses.length
      ) {

        proximos.innerHTML =
          `<div class="sin-buses">
            No hay próximos buses disponibles para esta línea en este momento.
          </div>`;

        return;
      }


      // Ordenar por ETA
      const ordenados =
        [...buses].sort(
          (a, b) =>
            Number(a.eta || 999999) -
            Number(b.eta || 999999)
        );


      proximos.innerHTML =
        `<h3>
          Próximos ${lineaActual}
        </h3>`;


      for (
        const bus of ordenados
      ) {

        const elemento =
          document.createElement('div');

        elemento.className =
          'bus';


        const eta =
          formatearETA(
            bus.eta
          );


        const accesibilidad =
          bus.access ||
          'Sin datos';


        const confort =
          bus.thermalConfort ||
          'Sin datos';


        elemento.innerHTML = `
          <div class="bus-principal">

            <div>
              <div class="bus-linea">
                🚌 ${bus.line || lineaActual}
              </div>

              <div class="bus-detalles">
                ${bus.companyName || ''}
                ${bus.busId ? ' · Coche ' + bus.busId : ''}
              </div>
            </div>

            <div class="bus-eta">
              ${eta}
            </div>

          </div>

          <div class="bus-detalles">
            ${bus.origin || ''}
            →
            ${bus.destination || ''}
          </div>

          <div class="bus-detalles">
            ${bus.subline || ''}
          </div>

          <div class="bus-detalles">
            ${accesibilidad}
            ·
            ${confort}
          </div>
        `;


        proximos.appendChild(
          elemento
        );
      }
    }


    // =========================================================
    // GEOLOCALIZACIÓN
    // =========================================================

    function obtenerUbicacion() {

      if (
        !navigator.geolocation
      ) {

        estado.innerHTML =
          `<div class="error">
            Tu navegador no permite obtener la ubicación.
          </div>`;

        return;
      }


      btnUbicacion.disabled =
        true;

      btnUbicacion.textContent =
        '📍 Buscando...';


      estado.textContent =
        'Obteniendo tu ubicación...';


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          // -----------------------------------------
          // Marcador usuario
          // -----------------------------------------

          if (
            marcadorUsuario
          ) {
            mapa.removeLayer(
              marcadorUsuario
            );
          }

          marcadorUsuario =
            L.marker([
              lat,
              lon
            ])
            .addTo(mapa)
            .bindPopup(
              '📍 Estás aquí'
            );


          // -----------------------------------------
          // Círculo
          // -----------------------------------------

          if (
            circuloUsuario
          ) {
            mapa.removeLayer(
              circuloUsuario
            );
          }

          circuloUsuario =
            L.circle([
              lat,
              lon
            ], {
              radius:
                RADIO_PARADAS
            })
            .addTo(mapa);


          // -----------------------------------------
          // Centrar mapa
          // -----------------------------------------

          mapa.setView(
            [lat, lon],
            15
          );


          // -----------------------------------------
          // Buscar paradas
          // -----------------------------------------

          const cercanas =
            obtenerParadasCercanas(
              lat,
              lon
            );


          mostrarParadas(
            cercanas
          );

          mostrarMarcadores(
            cercanas
          );


          estado.textContent =
            `Encontramos ${cercanas.length} paradas cercanas.`;


          btnUbicacion.disabled =
            false;

          btnUbicacion.textContent =
            '📍 Actualizar ubicación';
        },


        function(error) {

          console.error(
            'Error geolocalización:',
            error
          );


          let mensaje =
            'No pudimos obtener tu ubicación.';


          if (
            error.code ===
            1
          ) {

            mensaje =
              'Permiso de ubicación denegado.';

          } else if (
            error.code ===
            2
          ) {

            mensaje =
              'No se pudo determinar tu ubicación.';

          } else if (
            error.code ===
            3
          ) {

            mensaje =
              'La ubicación tardó demasiado.';
          }


          estado.innerHTML =
            `<div class="error">
              ${mensaje}
            </div>`;


          btnUbicacion.disabled =
            false;

          btnUbicacion.textContent =
            '📍 Intentar nuevamente';
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }
      );
    }


    // =========================================================
    // BOTÓN UBICACIÓN
    // =========================================================

    btnUbicacion.addEventListener(
      'click',
      obtenerUbicacion
    );


    // =========================================================
    // INICIO
    // =========================================================

    async function iniciar() {

      await cargarParadas();

      // Intentamos obtener ubicación
      // automáticamente.
      obtenerUbicacion();
    }


    iniciar();

  </script>

</body>
</html>
