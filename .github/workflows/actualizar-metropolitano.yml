name: Actualizar piloto metropolitano MTOP
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: write
concurrency:
  group: datos-metropolitanos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualizar datos oficiales del corredor
        run: python scripts/actualizar_metropolitano.py
      - name: Publicar cambios si la fuente cambió
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metropolitano/corredor.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Actualizar piloto Las Piedras–Montevideo desde MTOP'
          git pull --rebase origin main
          git push
